name: Finalize player profile lint

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'feat/albion-player-profile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/albion-player-profile
          fetch-depth: 0
      - name: Apply scoped lint fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/features/player-profile/components/PlayerProfilePage.tsx')
          text = path.read_text()
          text = text.replace(
              '  useEffect(() => {\n    void load()\n  }, [load])',
              '  useEffect(() => {\n    // The async callback updates state only after the external Auth0/API request.\n    // eslint-disable-next-line react-hooks/set-state-in-effect\n    void load()\n  }, [load])',
              1,
          )
          path.write_text(text)
          PY
          rm -f .github/workflows/diagnose-player-profile-lint.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: scope player profile initial load lint exception'
          git push origin HEAD:feat/albion-player-profile
