name: Account access build diagnostics

on:
  pull_request:
    branches:
      - develop
    paths:
      - src/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/account-access-build-diagnostics.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture build output
        shell: bash
        run: |
          set +e
          pnpm build > build-output.log 2>&1
          status=$?
          cat build-output.log
          exit "$status"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-access-build-${{ github.run_id }}
          path: build-output.log
          if-no-files-found: error
          retention-days: 2
