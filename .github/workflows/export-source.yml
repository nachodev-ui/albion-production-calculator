name: Apply Albion profile frontend

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/albion-player-profile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/albion-player-profile
          fetch-depth: 0
      - name: Apply source patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_player_profile_frontend.py
          rm -f scripts/apply_player_profile_frontend.py
          rm -f .github/workflows/export-source.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: implement Albion player profile frontend'
          git push origin HEAD:feat/albion-player-profile
