name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_CENTRAL_MARKET_API_URL: https://albion-market-api.onrender.com/api/v1
      VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'
      VITE_MARKET_REQUEST_TIMEOUT_MS: '7000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate contracts and public security
        run: |
          pnpm contracts:check
          pnpm security:check

      - name: Run lint and tests
        run: |
          pnpm lint
          pnpm test

      - name: Build production application
        run: pnpm build

      - name: Validate bundle budget
        run: pnpm bundle:check

      - name: Validate Cloudflare credentials and Pages project
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing from the production environment."
            exit 1
          fi

          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing from the production environment."
            exit 1
          fi

          if [[ ! "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID does not have the expected 32-character format."
            exit 1
          fi

          verify_file="${RUNNER_TEMP}/cloudflare-token-verify.json"
          verify_status="$(curl \
            --silent \
            --show-error \
            --output "${verify_file}" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify")"

          if [[ "${verify_status}" != "200" ]] || \
             [[ "$(jq -r '.success // false' "${verify_file}")" != "true" ]] || \
             [[ "$(jq -r '.result.status // empty' "${verify_file}")" != "active" ]]; then
            echo "::error::Cloudflare rejected the API token for the configured account."
            jq -c '{success, errors, messages, status: .result.status}' "${verify_file}" || true
            exit 1
          fi

          project_file="${RUNNER_TEMP}/cloudflare-pages-project.json"
          project_status="$(curl \
            --silent \
            --show-error \
            --output "${project_file}" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/albion-production-calculator")"

          if [[ "${project_status}" != "200" ]] || \
             [[ "$(jq -r '.success // false' "${project_file}")" != "true" ]]; then
            echo "::error::The API token cannot access the albion-production-calculator Pages project in the configured account."
            jq -c '{success, errors, messages}' "${project_file}" || true
            exit 1
          fi

          echo "Cloudflare token, account and Pages project validated."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=albion-production-calculator --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false

      - name: Verify deployed frontend
        shell: bash
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            https://albion-production-calculator.pages.dev/ \
            | grep -F '<div id="root"></div>'

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            https://albion-market-api.onrender.com/readyz
