name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  statuses: write

concurrency:
  group: production-cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 5a398641827f64511f3d0df0323729bf
      VITE_CENTRAL_MARKET_API_URL: https://albion-market-api.onrender.com/api/v1
      VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'
      VITE_MARKET_REQUEST_TIMEOUT_MS: '7000'
      VITE_AUTH0_ENABLED: 'true'
      VITE_AUTH0_DOMAIN: albion-production-calculator.us.auth0.com
      VITE_AUTH0_CLIENT_ID: 4Bhvhd3PcxNwmMyvK5ocLi9Q33hHr74y
      VITE_AUTH0_AUDIENCE: https://albion-market-api
      VITE_AUTH0_SCOPE: openid profile email read:account

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mark production deployments pending
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for context in 'deploy/production' 'deploy/auth0-production'; do
            payload="$(jq -n \
              --arg state pending \
              --arg context "${context}" \
              --arg description 'Production deployment is running' \
              --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{state: $state, context: $context, description: $description, target_url: $target_url}')"

            curl \
              --fail \
              --silent \
              --show-error \
              --request POST \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data "${payload}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              >/dev/null
          done

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate contracts and public security
        run: |
          pnpm contracts:check
          pnpm security:check

      - name: Validate Auth0 production configuration
        run: pnpm auth0:check

      - name: Run lint and tests
        run: |
          pnpm lint
          pnpm test

      - name: Confirm API authentication is enabled
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl \
            --silent \
            --show-error \
            --output auth-response.json \
            --write-out '%{http_code}' \
            https://albion-market-api.onrender.com/api/v1/me)"
          if [[ "${status}" != '401' ]]; then
            echo "::error::Expected the API to require authentication with HTTP 401, got ${status}."
            cat auth-response.json
            exit 1
          fi

      - name: Build production application
        run: pnpm build

      - name: Validate bundle budget
        run: pnpm bundle:check

      - name: Validate production configuration in built bundle
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -R -Fq 'albion-market-api.onrender.com' dist; then
            echo '::error::The production build does not contain the Render API host.'
            exit 1
          fi

          if grep -R -Fq 'albion-market-api-nachodev.fly.dev' dist; then
            echo '::error::The production build still contains the obsolete Fly.io host.'
            exit 1
          fi

          for value in \
            "${VITE_AUTH0_DOMAIN}" \
            "${VITE_AUTH0_CLIENT_ID}" \
            "${VITE_AUTH0_AUDIENCE}" \
            'read:account'; do
            if [[ -z "${value}" ]] || ! grep -R -Fq "${value}" dist; then
              echo "::error::The Auth0 production value was not embedded in the build: ${value}"
              exit 1
            fi
          done

          echo 'Production build contains Render and the active Auth0 configuration.'

      - name: Deploy to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          deploy_log="${RUNNER_TEMP}/wrangler-production-deploy.log"

          npx --yes wrangler@4.110.0 pages deploy dist \
            --project-name=albion-production-calculator \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-dirty=false \
            2>&1 | tee "${deploy_log}"

      - name: Upload Wrangler deployment log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-production-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/wrangler-production-deploy.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify deployed frontend, Auth0 and API host
        shell: bash
        run: |
          set -euo pipefail

          expected_host='albion-market-api.onrender.com'
          obsolete_host='albion-market-api-nachodev.fly.dev'
          public_origin='https://albioncalculator.app'
          deploy_log="${RUNNER_TEMP}/wrangler-production-deploy.log"
          verification_log="${RUNNER_TEMP}/production-verification.log"

          exec > >(tee -a "${verification_log}") 2>&1

          deployment_origin="$(
            grep -oE 'https://[a-z0-9]+\.albion-production-calculator\.pages\.dev' "${deploy_log}" \
              | tail -n 1 \
              || true
          )"

          if [[ -z "${deployment_origin}" ]]; then
            echo '::error::Wrangler did not report an immutable deployment URL.'
            exit 1
          fi

          mapfile -t asset_paths < <(
            find dist -type f -name '*.js' -printf '/%P\n' | sort
          )

          if [[ "${#asset_paths[@]}" -eq 0 ]]; then
            echo '::error::The production build contains no JavaScript chunks.'
            exit 1
          fi

          echo "JavaScript chunks to verify: ${#asset_paths[@]}"

          verify_bundle() {
            local origin="$1"
            local attempts="$2"
            local label="$3"
            local html_file="${RUNNER_TEMP}/${label}-index.html"
            local bundle_file="${RUNNER_TEMP}/${label}-bundles.js"

            for attempt in $(seq 1 "${attempts}"); do
              local cache_buster="${GITHUB_SHA}-${attempt}-$(date +%s)"

              if ! curl \
                --fail \
                --show-error \
                --silent \
                --location \
                --header 'Cache-Control: no-cache' \
                --output "${html_file}" \
                "${origin}/?deployment-check=${cache_buster}"; then
                echo "${label} attempt ${attempt}: HTML is not reachable yet."
                sleep 5
                continue
              fi

              if ! grep -Fq '<div id="root"></div>' "${html_file}"; then
                echo "${label} attempt ${attempt}: root node is missing."
                sleep 5
                continue
              fi

              : > "${bundle_file}"
              local assets_ok=true

              for asset_path in "${asset_paths[@]}"; do
                if ! curl \
                  --fail \
                  --show-error \
                  --silent \
                  --location \
                  --header 'Cache-Control: no-cache' \
                  "${origin}${asset_path}?deployment-check=${cache_buster}" \
                  >> "${bundle_file}"; then
                  echo "${label} attempt ${attempt}: failed to download ${asset_path}."
                  assets_ok=false
                  break
                fi
              done

              if [[ "${assets_ok}" != true ]]; then
                sleep 5
                continue
              fi

              local auth0_ok=true
              for value in \
                "${VITE_AUTH0_DOMAIN}" \
                "${VITE_AUTH0_CLIENT_ID}" \
                "${VITE_AUTH0_AUDIENCE}" \
                'read:account'; do
                if ! grep -Fq "${value}" "${bundle_file}"; then
                  auth0_ok=false
                  break
                fi
              done

              if grep -Fq "${expected_host}" "${bundle_file}" && \
                 ! grep -Fq "${obsolete_host}" "${bundle_file}" && \
                 [[ "${auth0_ok}" == true ]]; then
                echo "${label}: deployed chunks contain Render and the active Auth0 configuration."
                return 0
              fi

              echo "${label} attempt ${attempt}: deployed chunks have not converged yet."
              sleep 5
            done

            echo "::error::${label} chunks did not converge to the expected production configuration."
            return 1
          }

          echo "Immutable deployment URL: ${deployment_origin}"
          verify_bundle "${deployment_origin}" 12 immutable
          verify_bundle "${public_origin}" 48 canonical

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            https://albion-market-api.onrender.com/readyz

          echo
          echo 'Production deployment, Auth0 bundle and Render readiness validated.'

      - name: Upload production verification log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: production-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/production-verification.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish production deployment statuses
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          if [[ "${JOB_STATUS}" == 'success' ]]; then
            state='success'
            description='Production and Auth0 deployment passed'
          else
            state='failure'
            description='Production or Auth0 deployment failed'
          fi

          for context in 'deploy/production' 'deploy/auth0-production'; do
            payload="$(jq -n \
              --arg state "${state}" \
              --arg context "${context}" \
              --arg description "${description}" \
              --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{state: $state, context: $context, description: $description, target_url: $target_url}')"

            curl \
              --fail \
              --silent \
              --show-error \
              --request POST \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data "${payload}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              >/dev/null
          done
