name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  statuses: write

concurrency:
  group: production-cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_CENTRAL_MARKET_API_URL: https://albion-market-api.onrender.com/api/v1
      VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'
      VITE_MARKET_REQUEST_TIMEOUT_MS: '7000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mark production deployment pending
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          payload="$(jq -n \
            --arg state pending \
            --arg context 'deploy/production' \
            --arg description 'Production deployment is running' \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "${payload}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            >/dev/null

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate contracts and public security
        run: |
          pnpm contracts:check
          pnpm security:check

      - name: Run lint and tests
        run: |
          pnpm lint
          pnpm test

      - name: Build production application
        run: pnpm build

      - name: Validate bundle budget
        run: pnpm bundle:check

      - name: Validate Cloudflare Pages access
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing from the production environment."
            exit 1
          fi

          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing from the production environment."
            exit 1
          fi

          if [[ ! "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID does not have the expected 32-character format."
            exit 1
          fi

          project_file="${RUNNER_TEMP}/cloudflare-pages-project.json"
          project_status="$(curl \
            --silent \
            --show-error \
            --output "${project_file}" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/albion-production-calculator")"

          if [[ "${project_status}" != "200" ]] || \
             [[ "$(jq -r '.success // false' "${project_file}")" != "true" ]]; then
            echo "::error::Cloudflare credentials cannot access the albion-production-calculator Pages project in the configured account."
            jq -c '{success, errors, messages}' "${project_file}" || true
            exit 1
          fi

          echo "Cloudflare account, token and Pages project access validated."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=albion-production-calculator --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false

      - name: Verify deployed frontend and API host
        shell: bash
        run: |
          set -euo pipefail

          frontend_origin='https://albion-production-calculator.pages.dev'
          expected_api='https://albion-market-api.onrender.com/api/v1'
          obsolete_host='albion-market-api-nachodev.fly.dev'
          html_file="${RUNNER_TEMP}/production-index.html"
          bundle_file="${RUNNER_TEMP}/production-bundles.js"
          verified=false

          for attempt in $(seq 1 24); do
            cache_buster="${GITHUB_SHA}-${attempt}-$(date +%s)"

            curl \
              --fail \
              --show-error \
              --silent \
              --location \
              --header 'Cache-Control: no-cache' \
              --output "${html_file}" \
              "${frontend_origin}/?deployment-check=${cache_buster}"

            if ! grep -Fq '<div id="root"></div>' "${html_file}"; then
              echo "Attempt ${attempt}: production HTML is not ready yet."
              sleep 5
              continue
            fi

            mapfile -t asset_paths < <(
              grep -oE '(src|href)="[^"]+\.js"' "${html_file}" \
                | sed -E 's/^(src|href)="//; s/"$//' \
                | sort -u
            )

            if [[ "${#asset_paths[@]}" -eq 0 ]]; then
              echo "Attempt ${attempt}: no JavaScript assets found."
              sleep 5
              continue
            fi

            : > "${bundle_file}"

            for asset_path in "${asset_paths[@]}"; do
              if [[ "${asset_path}" == http://* || "${asset_path}" == https://* ]]; then
                asset_url="${asset_path}"
              else
                asset_url="${frontend_origin}${asset_path}"
              fi

              curl \
                --fail \
                --show-error \
                --silent \
                --location \
                --header 'Cache-Control: no-cache' \
                "${asset_url}" \
                >> "${bundle_file}"
            done

            if grep -Fq "${expected_api}" "${bundle_file}" && \
               ! grep -Fq "${obsolete_host}" "${bundle_file}"; then
              verified=true
              echo "Production bundle uses Render and contains no Fly.io reference."
              break
            fi

            echo "Attempt ${attempt}: waiting for the new production bundle."
            sleep 5
          done

          if [[ "${verified}" != "true" ]]; then
            echo "::error::The public bundle did not converge to the expected Render API configuration."
            exit 1
          fi

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            https://albion-market-api.onrender.com/readyz

      - name: Publish production deployment status
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          if [[ "${JOB_STATUS}" == 'success' ]]; then
            state='success'
            description='Production deployment and smoke tests passed'
          else
            state='failure'
            description='Production deployment or smoke tests failed'
          fi

          payload="$(jq -n \
            --arg state "${state}" \
            --arg context 'deploy/production' \
            --arg description "${description}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "${payload}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            >/dev/null
