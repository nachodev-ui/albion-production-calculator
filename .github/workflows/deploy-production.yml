name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  statuses: write

concurrency:
  group: production-cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 5a398641827f64511f3d0df0323729bf
      VITE_CENTRAL_MARKET_API_URL: https://albion-market-api.onrender.com/api/v1
      VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'
      VITE_MARKET_REQUEST_TIMEOUT_MS: '7000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Mark production deployment pending
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          payload="$(jq -n \
            --arg state pending \
            --arg context 'deploy/production' \
            --arg description 'Production deployment is running' \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "${payload}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            >/dev/null

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate contracts and public security
        run: |
          pnpm contracts:check
          pnpm security:check

      - name: Run lint and tests
        run: |
          pnpm lint
          pnpm test

      - name: Build production application
        run: pnpm build

      - name: Validate bundle budget
        run: pnpm bundle:check

      - name: Collect Cloudflare deployment diagnostic
        id: cloudflare_diagnostic
        continue-on-error: true
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail

          diagnostic_file="${RUNNER_TEMP}/cloudflare-production-diagnostic.json"
          project_file="${RUNNER_TEMP}/cloudflare-pages-project.json"
          has_account_id=false
          has_api_token=false
          account_id_format_valid=false
          project_http_status='not-requested'
          project_success=false
          errors='[]'
          messages='[]'

          if [[ -n "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            has_account_id=true
          fi

          if [[ -n "${CLOUDFLARE_API_TOKEN}" ]]; then
            has_api_token=true
          fi

          if [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[0-9a-fA-F]{32}$ ]]; then
            account_id_format_valid=true
          fi

          if [[ "${has_account_id}" == true && \
                "${has_api_token}" == true && \
                "${account_id_format_valid}" == true ]]; then
            project_http_status="$(curl \
              --silent \
              --show-error \
              --output "${project_file}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/albion-production-calculator" \
              || printf '000')"

            if jq -e . "${project_file}" >/dev/null 2>&1; then
              project_success="$(jq -r '.success // false' "${project_file}")"
              errors="$(jq -c '.errors // []' "${project_file}")"
              messages="$(jq -c '.messages // []' "${project_file}")"
            fi
          fi

          jq -n \
            --argjson has_account_id "${has_account_id}" \
            --argjson has_api_token "${has_api_token}" \
            --argjson account_id_format_valid "${account_id_format_valid}" \
            --arg project_http_status "${project_http_status}" \
            --argjson project_success "${project_success}" \
            --argjson errors "${errors}" \
            --argjson messages "${messages}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg commit_sha "${GITHUB_SHA}" \
            '{
              has_account_id: $has_account_id,
              has_api_token: $has_api_token,
              account_id_format_valid: $account_id_format_valid,
              project_http_status: $project_http_status,
              project_success: $project_success,
              errors: $errors,
              messages: $messages,
              run_id: $run_id,
              commit_sha: $commit_sha
            }' \
            > "${diagnostic_file}"

          cat "${diagnostic_file}"

          if [[ "${has_account_id}" != true || \
                "${has_api_token}" != true || \
                "${account_id_format_valid}" != true || \
                "${project_http_status}" != '200' || \
                "${project_success}" != true ]]; then
            echo "::warning::Cloudflare preflight did not confirm project access; Wrangler will perform the authoritative deployment attempt."
            exit 1
          fi

      - name: Upload Cloudflare deployment diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/cloudflare-production-diagnostic.json
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to Cloudflare Pages
        id: cloudflare_deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=albion-production-calculator --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false

      - name: Verify deployed frontend and API host
        id: verify_production
        if: steps.cloudflare_deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          frontend_origin='https://albion-production-calculator.pages.dev'
          expected_api='https://albion-market-api.onrender.com/api/v1'
          obsolete_host='albion-market-api-nachodev.fly.dev'
          html_file="${RUNNER_TEMP}/production-index.html"
          bundle_file="${RUNNER_TEMP}/production-bundles.js"
          verified=false

          for attempt in $(seq 1 24); do
            cache_buster="${GITHUB_SHA}-${attempt}-$(date +%s)"

            curl \
              --fail \
              --show-error \
              --silent \
              --location \
              --header 'Cache-Control: no-cache' \
              --output "${html_file}" \
              "${frontend_origin}/?deployment-check=${cache_buster}"

            if ! grep -Fq '<div id="root"></div>' "${html_file}"; then
              echo "Attempt ${attempt}: production HTML is not ready yet."
              sleep 5
              continue
            fi

            mapfile -t asset_paths < <(
              grep -oE '(src|href)="[^"]+\.js"' "${html_file}" \
                | sed -E 's/^(src|href)="//; s/"$//' \
                | sort -u
            )

            if [[ "${#asset_paths[@]}" -eq 0 ]]; then
              echo "Attempt ${attempt}: no JavaScript assets found."
              sleep 5
              continue
            fi

            : > "${bundle_file}"

            for asset_path in "${asset_paths[@]}"; do
              if [[ "${asset_path}" == http://* || "${asset_path}" == https://* ]]; then
                asset_url="${asset_path}"
              else
                asset_url="${frontend_origin}${asset_path}"
              fi

              curl \
                --fail \
                --show-error \
                --silent \
                --location \
                --header 'Cache-Control: no-cache' \
                "${asset_url}" \
                >> "${bundle_file}"
            done

            if grep -Fq "${expected_api}" "${bundle_file}" && \
               ! grep -Fq "${obsolete_host}" "${bundle_file}"; then
              verified=true
              echo "Production bundle uses Render and contains no Fly.io reference."
              break
            fi

            echo "Attempt ${attempt}: waiting for the new production bundle."
            sleep 5
          done

          if [[ "${verified}" != true ]]; then
            echo "::error::The public bundle did not converge to the expected Render API configuration."
            exit 1
          fi

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            https://albion-market-api.onrender.com/readyz

      - name: Enforce production deployment result
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.cloudflare_deploy.outcome }}" != 'success' ]]; then
            echo "::error::Cloudflare Pages deployment failed."
            exit 1
          fi

          if [[ "${{ steps.verify_production.outcome }}" != 'success' ]]; then
            echo "::error::Production smoke tests failed."
            exit 1
          fi

          echo "Cloudflare Pages deployment and production smoke tests passed."

      - name: Publish production deployment status
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          if [[ "${JOB_STATUS}" == 'success' ]]; then
            state='success'
            description='Production deployment and smoke tests passed'
          else
            state='failure'
            description='Production deployment or smoke tests failed'
          fi

          payload="$(jq -n \
            --arg state "${state}" \
            --arg context 'deploy/production' \
            --arg description "${description}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "${payload}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            >/dev/null
