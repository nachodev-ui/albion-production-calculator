name: Apply shapeshifter artifact fix

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/shapeshifter-artifact-localization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_CENTRAL_MARKET_API_URL: https://api.example.invalid/api/v1
      VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply generator change
        run: node scripts/apply-shapeshifter-artifact-fix.mjs apply

      - name: Regenerate dataset
        run: pnpm generate:dataset

      - name: Verify focused dataset change
        run: node scripts/apply-shapeshifter-artifact-fix.mjs verify

      - name: Validate API contracts
        run: pnpm contracts:check

      - name: Validate public security config
        run: pnpm security:check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Check bundle budget
        id: bundle_budget
        continue-on-error: true
        run: pnpm exec tsx scripts/check-bundle-budget.ts --write-report

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shapeshifter-artifact-bundle-report
          path: artifacts/performance/bundle-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce bundle budget
        if: steps.bundle_budget.outcome == 'failure'
        run: exit 1

      - name: Build documentation
        run: pnpm docs:build

      - name: Publish validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-dataset.ts src/data/datasets/items.json
          git commit -m "fix: include shapeshifter alchemy ingredients"
          git push origin HEAD:${{ github.head_ref }}
