name: Normalize shapeshifter artifact dependencies

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  normalize:
    if: github.head_ref == 'fix/shapeshifter-artifact-localization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_CENTRAL_MARKET_API_URL: https://api.example.invalid/api/v1
      VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Keep alchemy dependencies as price leaves
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          generator_path = Path('scripts/generate-dataset.ts')
          generator = generator_path.read_text(encoding='utf-8')
          old = """  const recipe = isRoyalSigil(id)
              ? null
              : tiers.length > 0
                ? { tiers }
                : null"""
          new = """  const recipe = isRoyalSigil(id) || isAlchemyCraftingIngredient(id)
              ? null
              : tiers.length > 0
                ? { tiers }
                : null"""
          count = generator.count(old)
          if count != 1:
              raise SystemExit(
                  f'Condición recipe: se esperaba 1 coincidencia y hubo {count}'
              )
          generator_path.write_text(generator.replace(old, new, 1), encoding='utf-8')

          dataset_path = Path('src/data/datasets/items.json')
          items = json.loads(dataset_path.read_text(encoding='utf-8'))
          pattern = re.compile(r'^(?:T1_ALCHEMY_COMMON|T[357]_ALCHEMY_RARE_[A-Z0-9_]+)$')
          matched = [item for item in items if pattern.fullmatch(item['id'])]
          if len(matched) != 22:
              raise SystemExit(
                  f'Se esperaban 22 piezas de alquimia y hubo {len(matched)}'
              )
          for item in matched:
              item['recipe'] = None
          dataset_path.write_text(
              json.dumps(items, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Validate API contracts
        run: pnpm contracts:check

      - name: Validate public security config
        run: pnpm security:check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Check bundle budget
        run: pnpm exec tsx scripts/check-bundle-budget.ts --write-report

      - name: Build documentation
        run: pnpm docs:build

      - name: Publish normalized dependencies
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-dataset.ts src/data/datasets/items.json
          git commit -m "fix: treat shapeshifter artifacts as price leaves"
          git push origin HEAD:${{ github.head_ref }}
