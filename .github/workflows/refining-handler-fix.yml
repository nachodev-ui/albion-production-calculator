name: Refining handler repair

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/refining-calculator-mvp

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/refining-calculator-mvp
      - name: Repair page source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/refining-calculator/components/RefiningCalculatorPage.tsx')
          text = path.read_text()
          misplaced = (
              '  function changeEnchantment(nextEnchantment: RefiningEnchantment) {\n'
              '    resetManualPrices()\n'
              '    setEnchantment(nextEnchantment)\n'
              '  }\n\n'
          )
          if misplaced not in text:
              raise SystemExit('misplaced handler not found')
          text = text.replace(misplaced, '', 1)
          tier_start = text.index('  function changeTier(')
          return_index = text.index('  return (\n', tier_start)
          handler = (
              '  function changeEnchantment(nextEnchantment: RefiningEnchantment) {\n'
              '    resetManualPrices()\n'
              '    setEnchantment(nextEnchantment)\n'
              '  }\n\n'
          )
          path.write_text(text[:return_index] + handler + text[return_index:])
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/refining-calculator/components/RefiningCalculatorPage.tsx
          git commit -m 'fix(refining): move enchantment handler into calculator'
          git push origin HEAD:feat/refining-calculator-mvp
