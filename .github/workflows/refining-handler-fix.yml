name: Refining handler repair

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/refining-calculator-mvp

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/refining-calculator-mvp
      - name: Repair page source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/refining-calculator/components/RefiningCalculatorPage.tsx')
          lines = path.read_text().splitlines()
          component_index = next(
              index
              for index, line in enumerate(lines)
              if line.startswith('export function RefiningCalculatorPage')
          )

          misplaced_index = next(
              index
              for index, line in enumerate(lines[:component_index])
              if line.strip().startswith('function changeEnchantment(')
          )
          end_index = misplaced_index
          while end_index < len(lines) and lines[end_index].strip() != '}':
              end_index += 1
          if end_index >= len(lines):
              raise SystemExit('misplaced handler has no closing brace')
          if end_index + 1 < len(lines) and lines[end_index + 1] == '':
              end_index += 1
          del lines[misplaced_index : end_index + 1]

          component_index = next(
              index
              for index, line in enumerate(lines)
              if line.startswith('export function RefiningCalculatorPage')
          )
          tier_index = next(
              index
              for index, line in enumerate(lines[component_index:], component_index)
              if line.strip().startswith('function changeTier(')
          )
          brace_depth = 0
          tier_end = None
          for index in range(tier_index, len(lines)):
              brace_depth += lines[index].count('{') - lines[index].count('}')
              if index > tier_index and brace_depth == 0:
                  tier_end = index
                  break
          if tier_end is None:
              raise SystemExit('changeTier has no closing brace')

          handler = [
              '',
              '  function changeEnchantment(nextEnchantment: RefiningEnchantment) {',
              '    resetManualPrices()',
              '    setEnchantment(nextEnchantment)',
              '  }',
          ]
          lines[tier_end + 1 : tier_end + 1] = handler
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/refining-calculator/components/RefiningCalculatorPage.tsx
          git commit -m 'fix(refining): move enchantment handler into calculator'
          git push origin HEAD:feat/refining-calculator-mvp
