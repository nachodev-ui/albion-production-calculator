name: Refining handler repair

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/refining-calculator-mvp

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/refining-calculator-mvp
      - name: Repair page source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/features/refining-calculator/components/RefiningCalculatorPage.tsx')
          text = path.read_text()

          misplaced = re.compile(
              r"\n  function changeEnchantment\(nextEnchantment: RefiningEnchantment\) \{\n"
              r"    resetManualPrices\(\)\n"
              r"    setEnchantment\(nextEnchantment\)\n"
              r"  \}\n",
          )
          text, removed = misplaced.subn('\n', text, count=1)
          if removed != 1:
              raise SystemExit('misplaced handler was not found exactly once')

          marker = """  function changeTier(nextTier: RefiningTier) {
            resetManualPrices()
            setTier(nextTier)
            setEnchantment((current) =>
              normalizeRefiningEnchantment(resource, nextTier, current),
            )
            if (nextTier < 4) {
              setSelectedTierLevel(0)
              setOtherTierLevelsTotal(0)
            }
          }

          """
          handler = marker + """  function changeEnchantment(nextEnchantment: RefiningEnchantment) {
            resetManualPrices()
            setEnchantment(nextEnchantment)
          }

          """
          if text.count(marker) != 1:
              raise SystemExit(f'expected one tier handler marker, found {text.count(marker)}')

          path.write_text(text.replace(marker, handler, 1))
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/refining-calculator/components/RefiningCalculatorPage.tsx
          git commit -m 'fix(refining): move enchantment handler into calculator'
          git push origin HEAD:feat/refining-calculator-mvp
