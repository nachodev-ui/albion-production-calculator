name: Refining autofix

on:
  push:
    branches:
      - feat/refining-calculator-mvp

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/refining-calculator-mvp
      - name: Correct handler placement
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/features/refining-calculator/components/RefiningCalculatorPage.tsx')
          page = path.read_text()
          misplaced = """  function changeEnchantment(nextEnchantment: RefiningEnchantment) {
    resetManualPrices()
    setEnchantment(nextEnchantment)
  }

"""
          page = page.replace(misplaced, '', 1)
          anchor = """    if (nextTier < 4) {
      setSelectedTierLevel(0)
      setOtherTierLevelsTotal(0)
    }
  }

  return (
"""
          replacement = """    if (nextTier < 4) {
      setSelectedTierLevel(0)
      setOtherTierLevelsTotal(0)
    }
  }

  function changeEnchantment(nextEnchantment: RefiningEnchantment) {
    resetManualPrices()
    setEnchantment(nextEnchantment)
  }

  return (
"""
          if anchor not in page:
              raise SystemExit('Expected page anchor was not found')
          path.write_text(page.replace(anchor, replacement, 1))
      - name: Commit targeted changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/refining-calculator/components/RefiningCalculatorPage.tsx
          git commit -m 'fix(refining): place enchantment handler correctly'
          git push origin HEAD:feat/refining-calculator-mvp
