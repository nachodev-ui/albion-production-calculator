name: Inspect shapeshifter artifact localization

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'fix/shapeshifter-artifact-localization'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Inspect official localization and dataset coverage
        shell: bash
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE' > artifacts/shapeshifter-artifact-localization.json
          import { readFile } from 'node:fs/promises'

          const dataset = JSON.parse(
            await readFile('src/data/datasets/items.json', 'utf8'),
          )
          const [localizationResponse, xmlResponse] = await Promise.all([
            fetch(
              'https://raw.githubusercontent.com/ao-data/ao-bin-dumps/master/formatted/items.json',
            ),
            fetch(
              'https://raw.githubusercontent.com/ao-data/ao-bin-dumps/master/items.xml',
            ),
          ])
          if (!localizationResponse.ok) {
            throw new Error(`formatted/items.json: ${localizationResponse.status}`)
          }
          if (!xmlResponse.ok) {
            throw new Error(`items.xml: ${xmlResponse.status}`)
          }

          const localization = await localizationResponse.json()
          const xml = await xmlResponse.text()
          const byId = new Map(localization.map((entry) => [entry.UniqueName, entry]))
          const datasetById = new Map(dataset.map((item) => [item.id, item]))

          const shapeshifterItems = dataset.filter(
            (item) => item.category === 'weapon' && item.id.includes('SHAPESHIFTER'),
          )
          const ingredientIds = [
            ...new Set(
              shapeshifterItems.flatMap((item) =>
                (item.recipe?.tiers ?? []).flatMap((tier) =>
                  (tier.ingredients ?? []).map((ingredient) => ingredient.itemId),
                ),
              ),
            ),
          ].filter((id) => id.includes('ALCHEMY'))

          function readXmlNodes(id) {
            const escaped = id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
            const matches = [
              ...xml.matchAll(
                new RegExp(`<([a-z]+)\\b[^>]*\\buniquename="${escaped}"[^>]*>`, 'gi'),
              ),
            ]
            return matches.map((match) => {
              const openingTag = match[0]
              const readAttribute = (name) =>
                openingTag.match(new RegExp(`${name}="([^"]*)"`, 'i'))?.[1] ?? null
              return {
                tagName: match[1],
                tier: readAttribute('tier'),
                shopCategory: readAttribute('shopcategory'),
                shopSubcategory1: readAttribute('shopsubcategory1'),
                craftingCategory: readAttribute('craftingcategory'),
              }
            })
          }

          const ingredients = ingredientIds.sort().map((id) => {
            const official = byId.get(id)
            const local = datasetById.get(id)
            return {
              id,
              dataset: local
                ? {
                    name: local.name,
                    category: local.category,
                    tier: local.tier,
                  }
                : null,
              xml: readXmlNodes(id),
              official: official
                ? {
                    localizationNameVariable:
                      official.LocalizationNameVariable ?? null,
                    es: official.LocalizedNames?.['ES-ES'] ?? null,
                    en: official.LocalizedNames?.['EN-US'] ?? null,
                  }
                : null,
            }
          })

          console.log(
            JSON.stringify(
              {
                shapeshifterItemCount: shapeshifterItems.length,
                ingredientCount: ingredientIds.length,
                missingFromDataset: ingredients
                  .filter((entry) => !entry.dataset)
                  .map((entry) => entry.id),
                technicalNamesInDataset: ingredients
                  .filter((entry) => entry.dataset?.name === entry.id)
                  .map((entry) => entry.id),
                missingOfficialSpanish: ingredients
                  .filter((entry) => !entry.official?.es)
                  .map((entry) => entry.id),
                ingredients,
              },
              null,
              2,
            ),
          )
          NODE

          cat artifacts/shapeshifter-artifact-localization.json

      - name: Upload localization report
        uses: actions/upload-artifact@v4
        with:
          name: shapeshifter-artifact-localization
          path: artifacts/shapeshifter-artifact-localization.json
          retention-days: 7
