name: Apply shapeshifter artifact localization fix

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'fix/shapeshifter-artifact-localization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_CENTRAL_MARKET_API_URL: https://api.example.invalid/api/v1
      VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Include required alchemy ingredients
        shell: bash
        run: |
          cp src/data/datasets/items.json /tmp/items-before.json
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate-dataset.ts')
          text = path.read_text(encoding='utf-8')

          old_helpers = """const ROYAL_SIGIL_PATTERN = /^QUESTITEM_TOKEN_ROYAL_T[4-8]$/

          function isRoyalSigil(uniqueName: string): boolean {
            return ROYAL_SIGIL_PATTERN.test(uniqueName)
          }
"""
          new_helpers = """const ROYAL_SIGIL_PATTERN = /^QUESTITEM_TOKEN_ROYAL_T[4-8]$/
          const ALCHEMY_CRAFTING_INGREDIENT_PATTERN =
            /^(?:T1_ALCHEMY_COMMON|T[357]_ALCHEMY_RARE_[A-Z0-9_]+)$/

          function isRoyalSigil(uniqueName: string): boolean {
            return ROYAL_SIGIL_PATTERN.test(uniqueName)
          }

          function isAlchemyCraftingIngredient(uniqueName: string): boolean {
            return ALCHEMY_CRAFTING_INGREDIENT_PATTERN.test(uniqueName)
          }
"""
          old_category = """    const category = isRoyalSigil(id)
                ? 'other'
                : mapCategory(tagName, shopCategory, shopSubcategory1)"""
          new_category = """    const category = isRoyalSigil(id) || isAlchemyCraftingIngredient(id)
                ? 'other'
                : mapCategory(tagName, shopCategory, shopSubcategory1)"""

          for old, new, label in (
              (old_helpers, new_helpers, 'helper de ingredientes de alquimia'),
              (old_category, new_category, 'clasificación de ingredientes de alquimia'),
          ):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: se esperaba 1 coincidencia y hubo {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate dataset
        run: pnpm generate:dataset

      - name: Verify focused dataset change
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'

          const before = JSON.parse(await readFile('/tmp/items-before.json', 'utf8'))
          const after = JSON.parse(
            await readFile('src/data/datasets/items.json', 'utf8'),
          )
          const beforeIds = new Set(before.map((item) => item.id))
          const afterIds = new Set(after.map((item) => item.id))
          const added = after.filter((item) => !beforeIds.has(item.id))
          const removed = before.filter((item) => !afterIds.has(item.id))
          const expectedPattern = /^(?:T1_ALCHEMY_COMMON|T[357]_ALCHEMY_RARE_[A-Z0-9_]+)$/

          console.log(
            JSON.stringify(
              {
                before: before.length,
                after: after.length,
                added: added.map(({ id, name, category }) => ({ id, name, category })),
                removed: removed.map(({ id }) => id),
              },
              null,
              2,
            ),
          )

          if (added.length !== 22) {
            throw new Error(`Se esperaban 22 ingredientes añadidos y hubo ${added.length}`)
          }
          if (removed.length !== 0) {
            throw new Error(`La regeneración eliminó ${removed.length} objetos`)
          }
          if (
            added.some(
              (item) =>
                !expectedPattern.test(item.id) ||
                item.category !== 'other' ||
                item.name === item.id,
            )
          ) {
            throw new Error('La regeneración añadió objetos inesperados o sin localizar')
          }

          const byId = new Map(after.map((item) => [item.id, item]))
          const expected = new Map([
            ['T5_ALCHEMY_RARE_PANTHER', 'Garras sombrías finas'],
            ['T5_ALCHEMY_RARE_WEREWOLF', 'Colmillos de hombre lobo finos'],
          ])
          for (const [id, name] of expected) {
            if (byId.get(id)?.name !== name) {
              throw new Error(`${id} no tiene la traducción oficial esperada`)
            }
          }
          NODE

      - name: Validate API contracts
        run: pnpm contracts:check

      - name: Validate public security config
        run: pnpm security:check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Check bundle budget
        run: pnpm exec tsx scripts/check-bundle-budget.ts --write-report

      - name: Build documentation
        run: pnpm docs:build

      - name: Publish validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-dataset.ts src/data/datasets/items.json
          git commit -m "fix: include shapeshifter alchemy ingredients"
          git push origin HEAD:${{ github.head_ref }}
