name: Apply shapeshifter artifact localization fix

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'fix/shapeshifter-artifact-localization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_CENTRAL_MARKET_API_URL: https://api.example.invalid/api/v1
      VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Include alchemy crafting ingredients
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate-dataset.ts')
          text = path.read_text(encoding='utf-8')
          old = """      if (shopSubcategory1 === 'refinedresources') return 'refined_resource'
                if (shopSubcategory1 === 'resources') return 'resource'

                // Artefactos de facción"""
          new = """      if (shopSubcategory1 === 'refinedresources') return 'refined_resource'
                if (shopSubcategory1 === 'resources') return 'resource'
                if (shopCategory === 'crafting' && shopSubcategory1 === 'alchemy') {
                  return 'other'
                }

                // Artefactos de facción"""
          if text.count(old) != 1:
              raise SystemExit(
                  f'Se esperaba una coincidencia para simpleitem alchemy y hubo {text.count(old)}'
              )
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Regenerate dataset
        run: pnpm generate:dataset

      - name: Verify reported names
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises'

          const items = JSON.parse(
            await readFile('src/data/datasets/items.json', 'utf8'),
          )
          const byId = new Map(items.map((item) => [item.id, item]))
          const expected = new Map([
            ['T5_ALCHEMY_RARE_PANTHER', 'Garras sombrías finas'],
            ['T5_ALCHEMY_RARE_WEREWOLF', 'Colmillos de hombre lobo finos'],
          ])

          for (const [id, name] of expected) {
            const item = byId.get(id)
            if (!item) throw new Error(`${id} sigue ausente del dataset`)
            if (item.name !== name) {
              throw new Error(`${id}: se esperaba "${name}" y se obtuvo "${item.name}"`)
            }
            if (item.category !== 'other') {
              throw new Error(`${id}: categoría inesperada ${item.category}`)
            }
          }
          NODE

      - name: Validate API contracts
        run: pnpm contracts:check

      - name: Validate public security config
        run: pnpm security:check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build

      - name: Check bundle budget
        run: pnpm exec tsx scripts/check-bundle-budget.ts --write-report

      - name: Build documentation
        run: pnpm docs:build

      - name: Publish validated fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-dataset.ts src/data/datasets/items.json
          git commit -m "fix: include shapeshifter alchemy ingredients"
          git push origin HEAD:${{ github.head_ref }}
