name: Inspect shapeshifter artifact localization

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'fix/shapeshifter-artifact-localization'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Inspect official localization
        shell: bash
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE' > artifacts/shapeshifter-artifact-localization.json
          import { readFile } from 'node:fs/promises'

          const dataset = JSON.parse(
            await readFile('src/data/datasets/items.json', 'utf8'),
          )
          const response = await fetch(
            'https://raw.githubusercontent.com/ao-data/ao-bin-dumps/master/formatted/items.json',
          )
          if (!response.ok) {
            throw new Error(`formatted/items.json: ${response.status}`)
          }
          const localization = await response.json()
          const byId = new Map(localization.map((entry) => [entry.UniqueName, entry]))

          const shapeshifterItems = dataset.filter(
            (item) => item.category === 'weapon' && item.id.includes('SHAPESHIFTER'),
          )
          const ingredientIds = [
            ...new Set(
              shapeshifterItems.flatMap((item) =>
                (item.recipe?.tiers ?? []).flatMap((tier) =>
                  (tier.ingredients ?? []).map((ingredient) => ingredient.itemId),
                ),
              ),
            ),
          ].filter((id) => id.includes('ALCHEMY'))

          const result = ingredientIds.sort().map((id) => {
            const direct = byId.get(id)
            const suffix = id.replace(/^T\d+_/, '')
            const candidates = localization
              .filter(
                (entry) =>
                  entry.UniqueName.includes('ALCHEMY_RARE') &&
                  (entry.UniqueName.endsWith(suffix) ||
                    entry.UniqueName.includes(suffix.replace(/^ALCHEMY_/, ''))),
              )
              .map((entry) => ({
                id: entry.UniqueName,
                localizationNameVariable: entry.LocalizationNameVariable ?? null,
                es: entry.LocalizedNames?.['ES-ES'] ?? null,
                en: entry.LocalizedNames?.['EN-US'] ?? null,
              }))

            return {
              id,
              direct: direct
                ? {
                    localizationNameVariable:
                      direct.LocalizationNameVariable ?? null,
                    es: direct.LocalizedNames?.['ES-ES'] ?? null,
                    en: direct.LocalizedNames?.['EN-US'] ?? null,
                  }
                : null,
              candidates,
            }
          })

          console.log(
            JSON.stringify(
              {
                shapeshifterItemCount: shapeshifterItems.length,
                ingredientCount: ingredientIds.length,
                missingDirectLocalization: result
                  .filter((entry) => !entry.direct?.es)
                  .map((entry) => entry.id),
                ingredients: result,
              },
              null,
              2,
            ),
          )
          NODE

          cat artifacts/shapeshifter-artifact-localization.json

      - name: Upload localization report
        uses: actions/upload-artifact@v4
        with:
          name: shapeshifter-artifact-localization
          path: artifacts/shapeshifter-artifact-localization.json
          retention-days: 7
