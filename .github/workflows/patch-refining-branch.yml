name: Patch refining market branch

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.issue.number == 263 &&
      github.event.comment.body == '/apply-refining-patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/refining-city-price-confidence
          fetch-depth: 0
      - name: Apply refining market UI
        run: python scripts/patch-refining-market-ui.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/refining-calculator/components/RefiningCalculatorPage.tsx
          git commit -m 'feat: restore rich refining market controls'
          git push origin HEAD:fix/refining-city-price-confidence
