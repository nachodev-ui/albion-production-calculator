name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_CENTRAL_MARKET_API_URL: https://api.example.invalid/api/v1
      VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'
      VITE_AUTH0_ENABLED: 'false'
      VITE_AUTH0_AUDIENCE: https://albion-market-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ux/refining-market-card-controls

      - name: Move market controls into their cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/refining-calculator/components/RefiningCalculatorPage.tsx')
          text = path.read_text(encoding='utf-8')
          panel_marker = '          <Panel eyebrow="3 · Mercado" title="Dónde comprar y dónde vender">'
          controls_marker = '            <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">'
          status_marker = '            <div className="mt-5 flex flex-col gap-3 rounded-xl border border-border bg-surface-raised p-4 sm:flex-row sm:items-center sm:justify-between">'

          panel_start = text.index(panel_marker)
          controls_start = text.index(controls_marker, panel_start)
          status_start = text.index(status_marker, controls_start)

          new_layout = '''            <div className="grid gap-4 sm:grid-cols-2">
              <Field label="Servidor">
                <select
                  value={market.config.server}
                  onChange={(event) =>
                    market.setConfig({ server: event.target.value as AlbionServer })
                  }
                  className={INPUT_CLASS}
                >
                  {Object.entries(MARKET_SERVER_LABELS).map(([value, label]) => (
                    <option key={value} value={value}>
                      {label}
                    </option>
                  ))}
                </select>
              </Field>
              <Field
                label="Estado Premium"
                hint="Premium no cambia el RRR; aquí solo ajusta el impuesto de venta."
              >
                <select
                  value={isPremium ? 'premium' : 'standard'}
                  onChange={(event) => setIsPremium(event.target.value === 'premium')}
                  className={INPUT_CLASS}
                >
                  <option value="premium">Premium · impuesto 4%</option>
                  <option value="standard">Sin Premium · impuesto 8%</option>
                </select>
              </Field>
            </div>

            <div className="mt-6 grid gap-4 lg:grid-cols-2">
              <section className="rounded-2xl border border-border bg-surface-raised p-4 sm:p-5">
                <div className="flex items-center gap-3 border-b border-border pb-4">
                  <div className="flex -space-x-3">
                    <ItemIcon
                      itemId={recipe.rawItemId}
                      enchantment={recipe.rawEnchantment}
                      name={rawName}
                      size={56}
                      priority="high"
                      className="rounded-lg border-border bg-bg/70"
                    />
                    {recipe.previousRefinedItemId && (
                      <ItemIcon
                        itemId={recipe.previousRefinedItemId}
                        enchantment={recipe.previousRefinedEnchantment}
                        name={previousName}
                        size={56}
                        priority="high"
                        className="rounded-lg border-border bg-bg/70"
                      />
                    )}
                  </div>
                  <div>
                    <p className="text-[10px] font-semibold uppercase tracking-[0.15em] text-text-faint">
                      Compra de materiales
                    </p>
                    <p className="mt-1 text-sm font-semibold text-text">
                      Origen de los materiales
                    </p>
                    <p className="text-[11px] text-text-faint">
                      Elige la ciudad y el tipo de compra antes de revisar los precios.
                    </p>
                  </div>
                </div>

                <div className="mt-4 grid gap-4 sm:grid-cols-2">
                  <Field
                    label="Ciudad de compra"
                    hint="Mercado donde buscarás el recurso crudo y el refinado previo."
                  >
                    <select
                      value={market.config.purchaseCity}
                      onChange={(event) =>
                        market.setConfig({
                          purchaseCity: event.target.value as RefiningCityId,
                        })
                      }
                      className={INPUT_CLASS}
                    >
                      {REFINING_CITIES.map((candidate) => (
                        <option key={candidate} value={candidate}>
                          {REFINING_CITY_LABELS[candidate]}
                        </option>
                      ))}
                    </select>
                  </Field>
                  <Field label="Cómo comprar">
                    <select
                      value={market.config.purchaseStrategy}
                      onChange={(event) =>
                        market.setConfig({
                          purchaseStrategy: event.target.value as PurchaseStrategy,
                        })
                      }
                      className={INPUT_CLASS}
                    >
                      {Object.entries(PURCHASE_STRATEGY_LABELS).map(([value, label]) => (
                        <option key={value} value={value}>
                          {label}
                        </option>
                      ))}
                    </select>
                  </Field>
                </div>

                <div className="mt-5 grid gap-4 border-t border-border pt-5 sm:grid-cols-2">
                  <PriceField
                    label={`Compra: ${rawName}`}
                    manualValue={manualRawPrice}
                    automaticDetail={automaticRawDetail}
                    loading={market.status === 'loading'}
                    onChange={setManualRawPrice}
                  />
                  {recipe.previousRefinedItemId && (
                    <PriceField
                      label={`Compra: ${previousName}`}
                      manualValue={manualPreviousPrice}
                      automaticDetail={automaticPreviousDetail}
                      loading={market.status === 'loading'}
                      onChange={setManualPreviousPrice}
                    />
                  )}
                </div>
              </section>

              <section className="rounded-2xl border border-accent-border bg-accent-muted/20 p-4 sm:p-5">
                <div className="flex items-center gap-3 border-b border-accent-border/50 pb-4">
                  <ItemIcon
                    itemId={recipe.outputItemId}
                    enchantment={recipe.outputEnchantment}
                    name={outputName}
                    size={64}
                    priority="high"
                    className="rounded-lg bg-bg/45"
                  />
                  <div>
                    <p className="text-[10px] font-semibold uppercase tracking-[0.15em] text-accent">
                      Venta del refinado
                    </p>
                    <p className="mt-1 text-sm font-semibold text-text">
                      Destino del refinado
                    </p>
                    <p className="text-[11px] text-text-faint">
                      Elige la ciudad y la estrategia de venta del producto terminado.
                    </p>
                  </div>
                </div>

                <div className="mt-4 grid gap-4 sm:grid-cols-2">
                  <Field
                    label="Ciudad de venta"
                    hint="Mercado donde venderás el recurso refinado terminado."
                  >
                    <select
                      value={market.config.saleCity}
                      onChange={(event) =>
                        market.setConfig({
                          saleCity: event.target.value as RefiningCityId,
                        })
                      }
                      className={INPUT_CLASS}
                    >
                      {REFINING_CITIES.map((candidate) => (
                        <option key={candidate} value={candidate}>
                          {REFINING_CITY_LABELS[candidate]}
                        </option>
                      ))}
                    </select>
                  </Field>
                  <Field label="Cómo vender">
                    <select
                      value={market.config.saleStrategy}
                      onChange={(event) =>
                        market.setConfig({
                          saleStrategy: event.target.value as SaleStrategy,
                        })
                      }
                      className={INPUT_CLASS}
                    >
                      {Object.entries(SALE_STRATEGY_LABELS).map(([value, label]) => (
                        <option key={value} value={value}>
                          {label}
                        </option>
                      ))}
                    </select>
                  </Field>
                </div>

                <div className="mt-5 border-t border-accent-border/50 pt-5">
                  <PriceField
                    label={`Venta: ${outputName}`}
                    manualValue={manualOutputPrice}
                    automaticDetail={market.automaticSalePriceDetail}
                    loading={market.status === 'loading'}
                    onChange={setManualOutputPrice}
                  />
                </div>
              </section>
            </div>

'''

          path.write_text(
              text[:controls_start] + new_layout + text[status_start:],
              encoding='utf-8',
          )
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ux: group refining market controls by transaction"
          git push origin HEAD:ux/refining-market-card-controls

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate API contracts
        run: pnpm contracts:check

      - name: Validate public security config
        run: pnpm security:check

      - name: Validate disabled Auth0 configuration
        run: pnpm auth0:check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm test > artifacts/test-output.log 2>&1
          status=$?
          cat artifacts/test-output.log
          exit "$status"

      - name: Upload failing test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-log
          path: artifacts/test-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build application
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm build > artifacts/build-output.log 2>&1
          status=$?
          cat artifacts/build-output.log
          exit "$status"

      - name: Upload failing build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: artifacts/build-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Check bundle budget
        run: pnpm exec tsx scripts/check-bundle-budget.ts --write-report

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: artifacts/performance/bundle-report.json
          if-no-files-found: ignore

      - name: Build documentation
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm docs:build > artifacts/docs-output.log 2>&1
          status=$?
          cat artifacts/docs-output.log
          exit "$status"

      - name: Upload failing documentation log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-failure-log
          path: artifacts/docs-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build production Auth0 variant
        shell: bash
        env:
          VITE_CENTRAL_MARKET_API_URL: https://albion-market-api.onrender.com/api/v1
          VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'
          VITE_MARKET_REQUEST_TIMEOUT_MS: '7000'
          VITE_AUTH0_ENABLED: 'true'
          VITE_AUTH0_DOMAIN: albion-production-calculator.us.auth0.com
          VITE_AUTH0_CLIENT_ID: 4Bhvhd3PcxNwmMyvK5ocLi9Q33hHr74y
          VITE_AUTH0_AUDIENCE: https://albion-market-api
          VITE_AUTH0_SCOPE: openid profile email read:account
        run: |
          pnpm build
          pnpm exec tsx scripts/check-bundle-budget.ts --write-report
          cp artifacts/performance/bundle-report.json artifacts/performance/production-bundle-report.json

      - name: Upload production bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-bundle-report
          path: artifacts/performance/production-bundle-report.json
          if-no-files-found: ignore
