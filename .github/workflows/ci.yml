name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_CENTRAL_MARKET_API_URL: https://api.example.invalid/api/v1
      VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'
      VITE_AUTH0_ENABLED: 'false'
      VITE_AUTH0_AUDIENCE: https://albion-market-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: fix/disable-enchanted-stone-refining

      - name: Apply stone refining correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          config = Path('src/features/refining-calculator/config/refiningGameConfig.ts')
          source = config.read_text(encoding='utf-8')
          source = source.replace(
              "    maximumEnchantment: 3,\n  },\n] as const",
              "    maximumEnchantment: 0,\n  },\n] as const",
              1,
          )
          if "maximumEnchantment: 3,\n  },\n] as const" in source:
              raise SystemExit('Rock maximum enchantment was not replaced')
          config.write_text(source, encoding='utf-8')

          component = Path('src/features/refining-calculator/components/RefiningCalculatorPage.tsx')
          source = component.read_text(encoding='utf-8')
          old = "La roca encantada produce múltiples bloques normales por tirada."
          new = "La piedra solo puede refinarse en .0; las variantes encantadas no se pueden refinar."
          if source.count(old) != 1:
              raise SystemExit('Expected the old stone explanation exactly once')
          component.write_text(source.replace(old, new, 1), encoding='utf-8')

          tests = Path('src/features/refining-calculator/utils/refiningEconomics.test.ts')
          source = tests.read_text(encoding='utf-8')
          old_test = """  it('models enchanted stone as multiplied previous blocks and output', () => {
    const recipe = getRefiningRecipe({
      resourceKind: 'rock',
      tier: 5,
      enchantment: 3,
    })

    expect(recipe.rawItemId).toBe('T5_ROCK_LEVEL3')
    expect(recipe.rawEnchantment).toBe(3)
    expect(recipe.previousRefinedItemId).toBe('T4_STONEBLOCK')
    expect(recipe.previousRefinedEnchantment).toBe(0)
    expect(recipe.outputItemId).toBe('T5_STONEBLOCK')
    expect(recipe.outputEnchantment).toBe(0)
    expect(recipe.rawPerCraft).toBe(3)
    expect(recipe.previousRefinedPerCraft).toBe(8)
    expect(recipe.outputPerCraft).toBe(8)
    expect(recipe.baseFocusPerCraft).toBe(752)
    expect(recipe.itemValuePerCraft).toBe(256)
  })"""
          new_test = """  it('normalizes stone to the flat .0 refining recipe', () => {
    const recipe = getRefiningRecipe({
      resourceKind: 'rock',
      tier: 5,
      enchantment: 3,
    })

    expect(recipe.enchantment).toBe(0)
    expect(recipe.rawItemId).toBe('T5_ROCK')
    expect(recipe.rawEnchantment).toBe(0)
    expect(recipe.previousRefinedItemId).toBe('T4_STONEBLOCK')
    expect(recipe.previousRefinedEnchantment).toBe(0)
    expect(recipe.outputItemId).toBe('T5_STONEBLOCK')
    expect(recipe.outputEnchantment).toBe(0)
    expect(recipe.rawPerCraft).toBe(3)
    expect(recipe.previousRefinedPerCraft).toBe(1)
    expect(recipe.outputPerCraft).toBe(1)
    expect(recipe.baseFocusPerCraft).toBe(94)
    expect(recipe.itemValuePerCraft).toBe(32)
  })"""
          if source.count(old_test) != 1:
              raise SystemExit('Expected the old stone test exactly once')
          tests.write_text(source.replace(old_test, new_test, 1), encoding='utf-8')
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/one-time-disable-enchanted-stone.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: restrict stone refining to flat tiers"
          git push origin HEAD:fix/disable-enchanted-stone-refining

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate API contracts
        run: pnpm contracts:check

      - name: Validate public security config
        run: pnpm security:check

      - name: Validate disabled Auth0 configuration
        run: pnpm auth0:check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm test > artifacts/test-output.log 2>&1
          status=$?
          cat artifacts/test-output.log
          exit "$status"

      - name: Upload failing test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-log
          path: artifacts/test-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build application
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm build > artifacts/build-output.log 2>&1
          status=$?
          cat artifacts/build-output.log
          exit "$status"

      - name: Upload failing build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: artifacts/build-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Check bundle budget
        run: pnpm exec tsx scripts/check-bundle-budget.ts --write-report

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: artifacts/performance/bundle-report.json
          if-no-files-found: ignore

      - name: Build documentation
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm docs:build > artifacts/docs-output.log 2>&1
          status=$?
          cat artifacts/docs-output.log
          exit "$status"

      - name: Upload failing documentation log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-failure-log
          path: artifacts/docs-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build production Auth0 variant
        shell: bash
        env:
          VITE_CENTRAL_MARKET_API_URL: https://albion-market-api.onrender.com/api/v1
          VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'
          VITE_MARKET_REQUEST_TIMEOUT_MS: '7000'
          VITE_AUTH0_ENABLED: 'true'
          VITE_AUTH0_DOMAIN: albion-production-calculator.us.auth0.com
          VITE_AUTH0_CLIENT_ID: 4Bhvhd3PcxNwmMyvK5ocLi9Q33hHr74y
          VITE_AUTH0_AUDIENCE: https://albion-market-api
          VITE_AUTH0_SCOPE: openid profile email read:account
        run: |
          pnpm build
          pnpm exec tsx scripts/check-bundle-budget.ts --write-report
          cp artifacts/performance/bundle-report.json artifacts/performance/production-bundle-report.json

      - name: Upload production bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-bundle-report
          path: artifacts/performance/production-bundle-report.json
          if-no-files-found: ignore
