name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-walkthrough:
    name: Finalize walkthrough assets
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/screenshot-walkthrough'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/screenshot-walkthrough
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore original PNG screenshots
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp --suffix=.tar.gz)"
          cat \
            .github/asset-parts/screenshots.part-00.b64 \
            .github/asset-parts/screenshots.part-01.b64 \
            .github/asset-parts/screenshots.part-02-00.b64 \
            .github/asset-parts/screenshots.part-02-01.b64 \
            .github/asset-parts/screenshots.part-02-02.b64 \
            .github/asset-parts/screenshots.part-02-03.b64 \
            .github/asset-parts/screenshots.part-03-00.b64 \
            .github/asset-parts/screenshots.part-03-01.b64 \
            .github/asset-parts/screenshots.part-03-02.b64 \
            .github/asset-parts/screenshots.part-03-03.b64 \
            .github/asset-parts/screenshots.part-04.b64 \
            .github/asset-parts/screenshots.part-05.b64 \
            | base64 --decode > "$archive"
          tar -tzf "$archive" | sort > /tmp/walkthrough-assets.txt
          diff -u <(printf '%s\n' \
            destiny-board-general-node.png \
            destiny-board-open.png \
            destiny-board-progress.png \
            destiny-board-specific-node.png | sort) /tmp/walkthrough-assets.txt
          mkdir -p public/assets/ui/destiny-board
          tar -xzf "$archive" -C public/assets/ui/destiny-board
          for asset in public/assets/ui/destiny-board/*.png; do
            test "$(head -c 8 "$asset" | xxd -p)" = "89504e470d0a1a0a"
          done
          rm -f public/assets/ui/destiny-board-specialization-guide.gif

      - name: Refresh dependency lockfile
        run: pnpm install --lockfile-only

      - name: Remove temporary files and restore CI
        shell: bash
        run: |
          rm -rf .github/asset-parts
          rm -f .github/workflows/materialize-walkthrough-assets.yml
          git fetch origin develop
          git checkout origin/develop -- .github/workflows/ci.yml

      - name: Commit finalized feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git diff --cached --stat
          git commit -m "build: add original Destiny Board screenshots"
          git push origin HEAD:feat/screenshot-walkthrough

  quality:
    name: Quality checks
    needs: materialize-walkthrough
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_CENTRAL_MARKET_API_URL: https://api.example.invalid/api/v1
      VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'
      VITE_AUTH0_ENABLED: 'false'
      VITE_AUTH0_AUDIENCE: https://albion-market-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: feat/screenshot-walkthrough

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate API contracts
        run: pnpm contracts:check

      - name: Validate public security config
        run: pnpm security:check

      - name: Validate disabled Auth0 configuration
        run: pnpm auth0:check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm test > artifacts/test-output.log 2>&1
          status=$?
          cat artifacts/test-output.log
          exit "$status"

      - name: Upload failing test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-log
          path: artifacts/test-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build application
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm build > artifacts/build-output.log 2>&1
          status=$?
          cat artifacts/build-output.log
          exit "$status"

      - name: Upload failing build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: artifacts/build-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Check bundle budget
        run: pnpm exec tsx scripts/check-bundle-budget.ts --write-report

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: artifacts/performance/bundle-report.json
          if-no-files-found: ignore

      - name: Build documentation
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm docs:build > artifacts/docs-output.log 2>&1
          status=$?
          cat artifacts/docs-output.log
          exit "$status"

      - name: Upload failing documentation log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-failure-log
          path: artifacts/docs-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build production Auth0 variant
        shell: bash
        env:
          VITE_CENTRAL_MARKET_API_URL: https://albion-market-api.onrender.com/api/v1
          VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'
          VITE_MARKET_REQUEST_TIMEOUT_MS: '7000'
          VITE_AUTH0_ENABLED: 'true'
          VITE_AUTH0_DOMAIN: albion-production-calculator.us.auth0.com
          VITE_AUTH0_CLIENT_ID: 4Bhvhd3PcxNwmMyvK5ocLi9Q33hHr74y
          VITE_AUTH0_AUDIENCE: https://albion-market-api
          VITE_AUTH0_SCOPE: openid profile email read:account
        run: |
          pnpm build
          pnpm exec tsx scripts/check-bundle-budget.ts --write-report
          cp artifacts/performance/bundle-report.json artifacts/performance/production-bundle-report.json

      - name: Upload production bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-bundle-report
          path: artifacts/performance/production-bundle-report.json
          if-no-files-found: ignore
