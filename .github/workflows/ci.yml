name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-copy-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/disable-enchanted-stone-refining
          fetch-depth: 0

      - name: Correct stone explanation and restore CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/refining-calculator/components/RefiningCalculatorPage.tsx')
          source = path.read_text(encoding='utf-8')
          old = 'La roca encantada produce múltiples bloques normales por tirada.'
          new = 'La piedra solo puede refinarse en .0; las variantes encantadas no se pueden refinar.'
          if source.count(old) != 1:
              raise SystemExit('Expected the old stone explanation exactly once')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/refining-calculator/components/RefiningCalculatorPage.tsx .github/workflows/ci.yml
          git commit -m "fix: clarify flat-only stone refining"
          git push origin HEAD:fix/disable-enchanted-stone-refining
