name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_CENTRAL_MARKET_API_URL: https://api.example.invalid/api/v1
      VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'
      VITE_AUTH0_ENABLED: 'false'
      VITE_AUTH0_AUDIENCE: https://albion-market-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply refining market UI patch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/refining-city-price-confidence'
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/features/refining-calculator/components/RefiningCalculatorPage.tsx')
          text = path.read_text(encoding='utf-8')
          marker = "import { RefiningMarketCitySelect } from './RefiningMarketCitySelect'"

          if marker not in text:
              replacements = [
                  (
                      "import { useCurrentMarketPrices } from '@features/market-data/hooks/useCurrentMarketPrices'\n",
                      "import { MarketPriceFreshnessStatus } from '@features/market-data/components/MarketPriceFreshnessStatus'\nimport { useCurrentMarketPrices } from '@features/market-data/hooks/useCurrentMarketPrices'\n",
                  ),
                  (
                      "} from '../utils/refiningEconomics'\n",
                      "} from '../utils/refiningEconomics'\nimport { RefiningMarketCitySelect } from './RefiningMarketCitySelect'\n",
                  ),
                  (
                      """        onChange={(event) => onChange(parseManualPrice(event.target.value))}
          className={INPUT_CLASS}
        />
      </Field>""",
                      """        onChange={(event) => onChange(parseManualPrice(event.target.value))}
          className={INPUT_CLASS}
        />
        {(!loading || automaticDetail?.value != null) && (
          <div className=\"mt-2\">
            <MarketPriceFreshnessStatus
              updatedAt={automaticDetail?.updatedAt ?? null}
              source={automaticDetail?.source ?? null}
              isActive={manualValue === null && automaticDetail?.value != null}
              priceValue={automaticDetail?.value ?? null}
              snapshot={
                automaticDetail?.value == null
                  ? undefined
                  : automaticDetail.snapshot
              }
              compact
            />
          </div>
        )}
      </Field>""",
                  ),
                  (
                      """  const automaticPreviousDetail = previousKey
    ? market.automaticPurchasePriceDetails.get(previousKey)
    : undefined
  const rawUnitPrice = manualRawPrice ?? automaticRawDetail?.value ?? 0""",
                      """  const automaticPreviousDetail = previousKey
    ? market.automaticPurchasePriceDetails.get(previousKey)
    : undefined
  const refiningMarkets = market.markets.filter(
    (candidate) =>
      candidate.type === 'regular' &&
      REFINING_CITIES.includes(candidate.key as RefiningCityId),
  )
  const purchasePriceGroups = [
    {
      label: rawItem?.name ?? resource.rawLabel,
      weight: recipe.rawPerCraft,
      options: market.materialMarketPriceComparisons.get(rawKey) ?? [],
    },
    ...(previousKey
      ? [
          {
            label: previousItem?.name ?? `${resource.refinedLabel} T${tier - 1}`,
            weight: recipe.previousRefinedPerCraft,
            options:
              market.materialMarketPriceComparisons.get(previousKey) ?? [],
          },
        ]
      : []),
  ]
  const salePriceGroups = [
    {
      label: outputItem?.name ?? resource.refinedLabel,
      weight: 1,
      options: market.saleMarketPriceOptions,
    },
  ]
  const rawUnitPrice = manualRawPrice ?? automaticRawDetail?.value ?? 0""",
                  ),
                  (
                      """                  <Field
                    label=\"Ciudad de compra\"
                    hint=\"Mercado donde buscarás el recurso crudo y el refinado previo.\"
                  >
                    <select
                      value={market.config.purchaseCity}
                      onChange={(event) =>
                        market.setConfig({
                          purchaseCity: event.target.value as RefiningCityId,
                        })
                      }
                      className={INPUT_CLASS}
                    >
                      {REFINING_CITIES.map((candidate) => (
                        <option key={candidate} value={candidate}>
                          {REFINING_CITY_LABELS[candidate]}
                        </option>
                      ))}
                    </select>
                  </Field>""",
                      """                  <Field
                    label=\"Ciudad de compra\"
                    hint=\"Compara en el mismo control el costo de todos los materiales por ciudad.\"
                  >
                    <RefiningMarketCitySelect
                      value={market.config.purchaseCity}
                      markets={refiningMarkets}
                      groups={purchasePriceGroups}
                      operation=\"purchase\"
                      ariaLabel=\"Ciudad de compra de materiales\"
                      menuLabel=\"Precios de compra por ciudad\"
                      onChange={(purchaseCity) => {
                        market.clearMaterialPurchaseCities()
                        market.setConfig({ purchaseCity })
                      }}
                    />
                  </Field>""",
                  ),
                  (
                      """                  <Field
                    label=\"Ciudad de venta\"
                    hint=\"Mercado donde venderás el recurso refinado terminado.\"
                  >
                    <select
                      value={market.config.saleCity}
                      onChange={(event) =>
                        market.setConfig({
                          saleCity: event.target.value as RefiningCityId,
                        })
                      }
                      className={INPUT_CLASS}
                    >
                      {REFINING_CITIES.map((candidate) => (
                        <option key={candidate} value={candidate}>
                          {REFINING_CITY_LABELS[candidate]}
                        </option>
                      ))}
                    </select>
                  </Field>""",
                      """                  <Field
                    label=\"Ciudad de venta\"
                    hint=\"Compara el precio del refinado terminado en cada mercado.\"
                  >
                    <RefiningMarketCitySelect
                      value={market.config.saleCity}
                      markets={refiningMarkets}
                      groups={salePriceGroups}
                      operation=\"sale\"
                      ariaLabel=\"Ciudad de venta del refinado\"
                      menuLabel=\"Precios de venta por ciudad\"
                      onChange={(saleCity) => market.setConfig({ saleCity })}
                    />
                  </Field>""",
                  ),
              ]

              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Expected source fragment was not found:\n{old[:240]}')
                  text = text.replace(old, new, 1)

              path.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet; then
            echo 'Refining UI already patched.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/features/refining-calculator/components/RefiningCalculatorPage.tsx
            git commit -m 'feat: restore rich refining market controls'
            git push origin HEAD:fix/refining-city-price-confidence
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate API contracts
        run: pnpm contracts:check

      - name: Validate public security config
        run: pnpm security:check

      - name: Validate disabled Auth0 configuration
        run: pnpm auth0:check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm test > artifacts/test-output.log 2>&1
          status=$?
          cat artifacts/test-output.log
          exit "$status"

      - name: Upload failing test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-log
          path: artifacts/test-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build application
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm build > artifacts/build-output.log 2>&1
          status=$?
          cat artifacts/build-output.log
          exit "$status"

      - name: Upload failing build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: artifacts/build-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Check bundle budget
        run: pnpm exec tsx scripts/check-bundle-budget.ts --write-report

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: artifacts/performance/bundle-report.json
          if-no-files-found: ignore

      - name: Build documentation
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm docs:build > artifacts/docs-output.log 2>&1
          status=$?
          cat artifacts/docs-output.log
          exit "$status"

      - name: Upload failing documentation log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-failure-log
          path: artifacts/docs-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build production Auth0 variant
        shell: bash
        env:
          VITE_CENTRAL_MARKET_API_URL: https://albion-market-api.onrender.com/api/v1
          VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'
          VITE_MARKET_REQUEST_TIMEOUT_MS: '7000'
          VITE_AUTH0_ENABLED: 'true'
          VITE_AUTH0_DOMAIN: albion-production-calculator.us.auth0.com
          VITE_AUTH0_CLIENT_ID: 4Bhvhd3PcxNwmMyvK5ocLi9Q33hHr74y
          VITE_AUTH0_AUDIENCE: https://albion-market-api
          VITE_AUTH0_SCOPE: openid profile email read:account
        run: |
          pnpm build
          pnpm exec tsx scripts/check-bundle-budget.ts --write-report
          cp artifacts/performance/bundle-report.json artifacts/performance/production-bundle-report.json

      - name: Upload production bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-bundle-report
          path: artifacts/performance/production-bundle-report.json
          if-no-files-found: ignore
