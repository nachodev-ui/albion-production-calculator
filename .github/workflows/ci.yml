name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_CENTRAL_MARKET_API_URL: https://api.example.invalid/api/v1
      VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply shapeshifter crafting fix
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/shapeshifter-crafting-catalog' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          node scripts/apply-shapeshifter-fix.mjs 2>&1 | tee artifacts/shapeshifter-apply.log

      - name: Upload shapeshifter apply log
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'fix/shapeshifter-crafting-catalog'
        uses: actions/upload-artifact@v4
        with:
          name: shapeshifter-apply-log
          path: artifacts/shapeshifter-apply.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Format shapeshifter changes
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/shapeshifter-crafting-catalog' && github.actor != 'github-actions[bot]'
        run: >-
          pnpm exec prettier --write
          scripts/generate-dataset.ts
          src/features/item-browser/data/craftingBranches.ts
          src/features/item-browser/data/__tests__/craftingBranches.test.ts

      - name: Validate API contracts
        run: pnpm contracts:check

      - name: Validate public security config
        run: pnpm security:check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm test > artifacts/test-output.log 2>&1
          status=$?
          cat artifacts/test-output.log
          exit "$status"

      - name: Upload failing test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-log
          path: artifacts/test-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build application
        run: pnpm build

      - name: Check bundle budget
        run: pnpm exec tsx scripts/check-bundle-budget.ts --write-report

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: artifacts/performance/bundle-report.json
          if-no-files-found: ignore

      - name: Build documentation
        run: pnpm docs:build

      - name: Publish validated shapeshifter fix
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/shapeshifter-crafting-catalog' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git rm .github/workflows/apply-shapeshifter-fix.yml
          git rm scripts/apply-shapeshifter-fix.mjs
          git show origin/develop:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git add scripts/generate-dataset.ts
          git add src/data/datasets/items.json
          git add src/features/item-browser/data/craftingBranches.ts
          git add src/features/item-browser/data/__tests__/craftingBranches.test.ts
          git commit -m "fix: add shapeshifter crafting catalog"
          git push origin HEAD:${{ github.head_ref }}
