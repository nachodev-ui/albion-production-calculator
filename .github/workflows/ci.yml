name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_CENTRAL_MARKET_API_URL: https://api.example.invalid/api/v1
      VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate API contracts
        run: pnpm contracts:check

      - name: Validate public security config
        run: pnpm security:check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm test > artifacts/test-output.log 2>&1
          status=$?
          cat artifacts/test-output.log
          exit "$status"

      - name: Upload failing test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-log
          path: artifacts/test-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build application
        run: pnpm build

      - name: Check bundle budget
        run: pnpm exec tsx scripts/check-bundle-budget.ts --write-report

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: artifacts/performance/bundle-report.json
          if-no-files-found: ignore

      - name: Build documentation
        run: pnpm docs:build
