name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_CENTRAL_MARKET_API_URL: https://api.example.invalid/api/v1
      VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'
      VITE_AUTH0_ENABLED: 'false'
      VITE_AUTH0_AUDIENCE: https://albion-market-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: style/refining-mechanics-typography

      - name: Apply one-time refining mechanics typography patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              Path('index.html'),
              'https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap',
              'https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Spectral:wght@400;500;600;700&display=swap',
          )

          css = Path('src/index.css')
          marker = """.tabular {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
          }
          """
          addition = marker + """

          /* Tipografía editorial exclusiva del bloque 2 · Mecánica del refinador. */
          .refining-mechanics-section > section > p:first-child {
            font-family: 'IBM Plex Sans', 'Inter', system-ui, sans-serif;
          }

          .refining-mechanics-section > section > h2 {
            font-family: 'Spectral', Georgia, serif;
            letter-spacing: -0.01em;
          }

          .refining-mechanics-section article > p:first-child {
            font-family: 'Inter', system-ui, sans-serif;
            font-weight: 600;
          }

          .refining-mechanics-section article > p:nth-child(2).tabular {
            font-family: 'Playfair Display', Georgia, serif;
            font-variant-numeric: lining-nums tabular-nums;
            letter-spacing: -0.01em;
          }

          .refining-mechanics-section article > p:nth-child(3),
          .refining-mechanics-section > section > div > p:last-child {
            font-family: 'Inter', system-ui, sans-serif;
          }
          """
          replace_once(css, marker, addition)

          page = Path('src/features/refining-calculator/components/RefiningCalculatorPage.tsx')
          replace_once(
              page,
              '<Panel eyebrow="2 · Mecánica" title="Materiales y retorno esperado">',
              '<div className="refining-mechanics-section">\n            <Panel eyebrow="2 · Mecánica" title="Materiales y retorno esperado">',
          )
          replace_once(
              page,
              '          </Panel>\n\n          <Panel eyebrow="3 · Mercado" title="Dónde comprar y dónde vender">',
              '            </Panel>\n          </div>\n\n          <Panel eyebrow="3 · Mercado" title="Dónde comprar y dónde vender">',
          )
          PY

          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/one-time-refining-mechanics-typography.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: refine mechanics card typography"
          git push origin HEAD:style/refining-mechanics-typography

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate API contracts
        run: pnpm contracts:check

      - name: Validate public security config
        run: pnpm security:check

      - name: Validate disabled Auth0 configuration
        run: pnpm auth0:check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm test > artifacts/test-output.log 2>&1
          status=$?
          cat artifacts/test-output.log
          exit "$status"

      - name: Upload failing test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-log
          path: artifacts/test-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build application
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm build > artifacts/build-output.log 2>&1
          status=$?
          cat artifacts/build-output.log
          exit "$status"

      - name: Upload failing build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: artifacts/build-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Check bundle budget
        run: pnpm exec tsx scripts/check-bundle-budget.ts --write-report

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: artifacts/performance/bundle-report.json
          if-no-files-found: ignore

      - name: Build documentation
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm docs:build > artifacts/docs-output.log 2>&1
          status=$?
          cat artifacts/docs-output.log
          exit "$status"

      - name: Upload failing documentation log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-failure-log
          path: artifacts/docs-output.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build production Auth0 variant
        shell: bash
        env:
          VITE_CENTRAL_MARKET_API_URL: https://albion-market-api.onrender.com/api/v1
          VITE_ENABLE_LOCAL_RECEIVER_FALLBACK: 'false'
          VITE_MARKET_REQUEST_TIMEOUT_MS: '7000'
          VITE_AUTH0_ENABLED: 'true'
          VITE_AUTH0_DOMAIN: albion-production-calculator.us.auth0.com
          VITE_AUTH0_CLIENT_ID: 4Bhvhd3PcxNwmMyvK5ocLi9Q33hHr74y
          VITE_AUTH0_AUDIENCE: https://albion-market-api
          VITE_AUTH0_SCOPE: openid profile email read:account
        run: |
          pnpm build
          pnpm exec tsx scripts/check-bundle-budget.ts --write-report
          cp artifacts/performance/bundle-report.json artifacts/performance/production-bundle-report.json

      - name: Upload production bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-bundle-report
          path: artifacts/performance/production-bundle-report.json
          if-no-files-found: ignore
