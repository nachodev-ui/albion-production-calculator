name: Generate guide images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guide-image-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Generate editorial guide screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright for image generation
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Generate PNG variants
        run: node scripts/guide-images/generate.mjs

      - name: Validate generated assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t images < <(find public/images/guides -type f -name '*.png' | sort)
          if [[ "${#images[@]}" -ne 9 ]]; then
            echo "::error::Expected 9 guide images, found ${#images[@]}."
            printf '%s\n' "${images[@]}"
            exit 1
          fi

          node scripts/guide-images/validate-assets.mjs

      - name: Upload generated images
        uses: actions/upload-artifact@v4
        with:
          name: guide-article-images-${{ github.run_id }}
          path: public/images/guides/*.png
          if-no-files-found: error
          retention-days: 30
