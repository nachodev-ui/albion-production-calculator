name: Generate guide images

on:
  push:
    branches:
      - feat/guide-article-images
    paths:
      - scripts/guide-images/**
      - .github/workflows/generate-guide-images.yml
  pull_request:
    branches:
      - develop
    paths:
      - scripts/guide-images/**
      - .github/workflows/generate-guide-images.yml

permissions:
  contents: write

concurrency:
  group: guide-image-generation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate editorial guide screenshots
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/guide-article-images
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright for image generation
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Generate PNG variants
        run: node scripts/guide-images/generate.mjs

      - name: Verify generated assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t images < <(find public/images/guides -type f -name '*.png' | sort)
          if [[ "${#images[@]}" -ne 9 ]]; then
            echo "::error::Expected 9 guide images, found ${#images[@]}."
            printf '%s\n' "${images[@]}"
            exit 1
          fi

          for image in "${images[@]}"; do
            file "${image}"
            test -s "${image}"
          done

      - name: Upload generated images
        uses: actions/upload-artifact@v4
        with:
          name: guide-article-images-${{ github.run_id }}
          path: public/images/guides/*.png
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/guides/*.png

          if git diff --cached --quiet; then
            echo 'Guide images are already current.'
            exit 0
          fi

          git commit -m 'assets: generate guide article images'
          git push origin HEAD:feat/guide-article-images
