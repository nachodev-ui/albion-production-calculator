name: Refining visual flow runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/refining-visual-flow
      - name: Extract and normalize visual patch
        shell: bash
        run: |
          awk '
            /^        run: \|$/ && !found { found=1; capture=1; next }
            /^      - name: Commit visual flow$/ { capture=0 }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/refining-visual-flow-patch.yml > refining-visual-patch.sh
          python - <<'PY'
          from pathlib import Path

          path = Path('refining-visual-patch.sh')
          lines = path.read_text().splitlines()

          import_index = lines.index('from pathlib import Path')
          lines.insert(import_index + 1, 'from textwrap import dedent, indent')

          helper_start = next(i for i, line in enumerate(lines) if line.startswith("helper = r'''"))
          helper_end = next(i for i in range(helper_start + 1, len(lines)) if lines[i] == "'''")
          lines[helper_start] = lines[helper_start].replace("helper = r'''", "helper = dedent(r'''", 1)
          lines[helper_end] = "''')"

          hero_start = next(i for i, line in enumerate(lines) if line.startswith("old_hero = '''"))
          hero_end = next(
              i
              for i in range(hero_start, len(lines))
              if lines[i] == 'text = text.replace(old_hero, new_hero, 1)'
          )
          hero_replacement = [
              "hero_anchor = '<p className=\"mt-2 max-w-3xl text-sm leading-relaxed text-text-muted\">'",
              "hero_start = text.index(hero_anchor, text.index('MVP económico T2–T8'))",
              "hero_start = text.rfind('\\n', 0, hero_start) + 1",
              "hero_end = text.index('</p>', hero_start) + len('</p>')",
              "new_hero = (",
              "    '            <p className=\"mt-2 max-w-3xl text-sm leading-relaxed text-text-muted\">\\n'",
              "    '              Sigue el flujo de una operación real: define qué refinar, revisa la\\n'",
              "    '              mecánica, decide dónde comprar y vender, agrega los costos y compara el\\n'",
              "    '              resultado con o sin foco.\\n'",
              "    '            </p>\\n'",
              "    '            <div className=\"mt-4 flex flex-wrap gap-2\" aria-label=\"Flujo de cálculo\">\\n'",
              "    \"              {['1 · Operación', '2 · Mecánica', '3 · Mercado', '4 · Costos', '5 · Resultado'].map(\\n\"",
              "    '                (step) => (\\n'",
              "    '                  <span\\n'",
              "    '                    key={step}\\n'",
              "    '                    className=\"rounded-full border border-border bg-surface/70 px-3 py-1 text-[10px] font-semibold uppercase tracking-[0.1em] text-text-muted\"\\n'",
              "    '                  >\\n'",
              "    '                    {step}\\n'",
              "    '                  </span>\\n'",
              "    '                ),\\n'",
              "    '              )}\\n'",
              "    '            </div>'",
              ")",
              "text = text[:hero_start] + new_hero + text[hero_end:]",
          ]
          lines[hero_start : hero_end + 1] = hero_replacement

          for variable in ('operation', 'market'):
              start = next(
                  i for i, line in enumerate(lines) if line.startswith(f"{variable} = r'''")
              )
              end = next(i for i in range(start + 1, len(lines)) if lines[i] == "'''")
              lines[start] = lines[start].replace(
                  f"{variable} = r'''",
                  f"{variable} = indent(dedent(r'''",
                  1,
              )
              lines[end] = "'''), '          ')"

          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Execute visual patch
        shell: bash
        run: |
          set +e
          bash refining-visual-patch.sh > refining-visual-patch.log 2>&1
          status=$?
          cat refining-visual-patch.log
          echo "$status" > refining-visual-patch.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: refining-visual-patch-diagnostics
          path: |
            refining-visual-patch.sh
            refining-visual-patch.log
            refining-visual-patch.status
          retention-days: 1
      - name: Preserve patch status
        shell: bash
        run: exit "$(cat refining-visual-patch.status)"
      - name: Commit visual flow
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/refining-calculator/components/RefiningCalculatorPage.tsx
          git commit -m 'feat(refining): add visual sequential workflow'
          git push origin HEAD:feat/refining-visual-flow
