name: Refining diagnostics

on:
  push:
    branches:
      - feat/refining-calculator-mvp

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Capture lint output
        shell: bash
        run: |
          set +e
          pnpm lint > refining-lint.log 2>&1
          status=$?
          cat refining-lint.log
          echo "lint_status=${status}" >> "$GITHUB_ENV"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: refining-lint-diagnostics
          path: refining-lint.log
          retention-days: 1
      - name: Preserve lint status
        run: exit "${lint_status}"
