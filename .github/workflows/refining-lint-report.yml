name: Refining lint report

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Capture lint
        shell: bash
        run: |
          set +e
          pnpm lint > refining-lint.log 2>&1
          echo $? > refining-lint-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: refining-final-lint-report
          path: |
            refining-lint.log
            refining-lint-status.txt
          retention-days: 1
