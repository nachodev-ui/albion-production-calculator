name: Extract profile weapon names

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract localized weapon names
        shell: bash
        run: |
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'

          const items = JSON.parse(await readFile('src/data/datasets/items.json', 'utf8'))
          const weaponNames = Object.fromEntries(
            items
              .filter((item) => item.category === 'weapon')
              .map((item) => [item.id, item.name])
              .sort(([left], [right]) => left.localeCompare(right)),
          )

          await writeFile(
            'artifacts/player-profile-weapon-names.json',
            `${JSON.stringify(weaponNames, null, 2)}\n`,
            'utf8',
          )

          const bearPaws = Object.entries(weaponNames).filter(([id]) =>
            id.includes('2H_DUALAXE_KEEPER'),
          )
          console.log(JSON.stringify({ count: Object.keys(weaponNames).length, bearPaws }, null, 2))
          NODE

      - name: Upload compact localization map
        uses: actions/upload-artifact@v4
        with:
          name: player-profile-weapon-names
          path: artifacts/player-profile-weapon-names.json
          retention-days: 3
