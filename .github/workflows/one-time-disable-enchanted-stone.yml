name: One-time disable enchanted stone refining

on:
  push:
    branches:
      - fix/disable-enchanted-stone-refining

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/disable-enchanted-stone-refining

      - name: Correct stone refining rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          config = Path('src/features/refining-calculator/config/refiningGameConfig.ts')
          source = config.read_text(encoding='utf-8')
          old_resource = """  {
    kind: 'rock',
    label: 'Roca → bloques de piedra',
    rawLabel: 'Roca',
    refinedLabel: 'Bloques de piedra',
    rawItemSuffix: 'ROCK',
    refinedItemSuffix: 'STONEBLOCK',
    specialtyCity: 'bridgewatch',
    maximumEnchantment: 3,
  },"""
          new_resource = """  {
    kind: 'rock',
    label: 'Roca → bloques de piedra',
    rawLabel: 'Roca',
    refinedLabel: 'Bloques de piedra',
    rawItemSuffix: 'ROCK',
    refinedItemSuffix: 'STONEBLOCK',
    specialtyCity: 'bridgewatch',
    maximumEnchantment: 0,
  },"""
          if source.count(old_resource) != 1:
              raise SystemExit('Expected the rock resource definition exactly once')
          source = source.replace(old_resource, new_resource, 1)
          config.write_text(source, encoding='utf-8')

          component = Path('src/features/refining-calculator/components/RefiningCalculatorPage.tsx')
          source = component.read_text(encoding='utf-8')
          old_copy = """                  {resourceKind === 'rock'
                    ? 'La roca encantada produce múltiples bloques normales por tirada.'
                    : tier === 4
                      ? 'T4 encantado utiliza refinado T3 normal.'
                      : 'Desde T5, el refinado previo conserva el encantamiento.'}"""
          new_copy = """                  {resourceKind === 'rock'
                    ? 'La piedra solo puede refinarse en .0; las variantes encantadas no se pueden refinar.'
                    : tier === 4
                      ? 'T4 encantado utiliza refinado T3 normal.'
                      : 'Desde T5, el refinado previo conserva el encantamiento.'}"""
          if source.count(old_copy) != 1:
              raise SystemExit('Expected the stone enchantment explanation exactly once')
          source = source.replace(old_copy, new_copy, 1)
          component.write_text(source, encoding='utf-8')

          tests = Path('src/features/refining-calculator/utils/refiningEconomics.test.ts')
          source = tests.read_text(encoding='utf-8')
          old_test = """  it('models enchanted stone as multiplied previous blocks and output', () => {
    const recipe = getRefiningRecipe({
      resourceKind: 'rock',
      tier: 5,
      enchantment: 3,
    })

    expect(recipe.rawItemId).toBe('T5_ROCK_LEVEL3')
    expect(recipe.rawEnchantment).toBe(3)
    expect(recipe.previousRefinedItemId).toBe('T4_STONEBLOCK')
    expect(recipe.previousRefinedEnchantment).toBe(0)
    expect(recipe.outputItemId).toBe('T5_STONEBLOCK')
    expect(recipe.outputEnchantment).toBe(0)
    expect(recipe.rawPerCraft).toBe(3)
    expect(recipe.previousRefinedPerCraft).toBe(8)
    expect(recipe.outputPerCraft).toBe(8)
    expect(recipe.baseFocusPerCraft).toBe(752)
    expect(recipe.itemValuePerCraft).toBe(256)
  })"""
          new_test = """  it('normalizes stone to the flat .0 refining recipe', () => {
    const recipe = getRefiningRecipe({
      resourceKind: 'rock',
      tier: 5,
      enchantment: 3,
    })

    expect(recipe.enchantment).toBe(0)
    expect(recipe.rawItemId).toBe('T5_ROCK')
    expect(recipe.rawEnchantment).toBe(0)
    expect(recipe.previousRefinedItemId).toBe('T4_STONEBLOCK')
    expect(recipe.previousRefinedEnchantment).toBe(0)
    expect(recipe.outputItemId).toBe('T5_STONEBLOCK')
    expect(recipe.outputEnchantment).toBe(0)
    expect(recipe.rawPerCraft).toBe(3)
    expect(recipe.previousRefinedPerCraft).toBe(1)
    expect(recipe.outputPerCraft).toBe(1)
    expect(recipe.baseFocusPerCraft).toBe(94)
    expect(recipe.itemValuePerCraft).toBe(32)
  })"""
          if source.count(old_test) != 1:
              raise SystemExit('Expected the enchanted stone test exactly once')
          source = source.replace(old_test, new_test, 1)
          tests.write_text(source, encoding='utf-8')

          Path('.github/workflows/one-time-disable-enchanted-stone.yml').unlink()
          PY

      - name: Commit finalized stone correction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: restrict stone refining to flat tiers"
          git push origin HEAD:fix/disable-enchanted-stone-refining
