name: Diagnose crafting workspace

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  lint-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Capture lint output
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          pnpm lint > artifacts/lint-output.log 2>&1
          status=$?
          cat artifacts/lint-output.log
          echo "${status}" > artifacts/lint-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: crafting-workspace-lint-diagnostics
          path: artifacts/
          retention-days: 1
