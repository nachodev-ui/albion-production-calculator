name: Refining integration cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/refining-calculator-mvp
      - name: Integrate the real refining page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          old_import = '''const RefiningComingSoonPage = lazy(() =>
            import("@features/refining-calculator/components/RefiningComingSoonPage").then(
              (module) => ({ default: module.RefiningComingSoonPage }),
            ),
          );'''
          new_import = '''const RefiningCalculatorPage = lazy(() =>
            import("@features/refining-calculator/components/RefiningCalculatorPage").then(
              (module) => ({ default: module.RefiningCalculatorPage }),
            ),
          );'''
          if app.count(old_import) != 1:
              raise SystemExit(f'expected one legacy lazy import, found {app.count(old_import)}')
          app = app.replace(old_import, new_import, 1)

          old_route = '''        {route === "refining" && (
                    <>
                      <ModuleHeader
                        eyebrow="Módulo de refinamiento"
                        title="Calculadora de refinamiento"
                        description="Un espacio dedicado a convertir recursos, retornos y tarifas de estación en costos netos y decisiones de venta claras."
                        badge="Próximamente"
                      />
                      <Suspense fallback={<ModuleFallback label="refinamiento" />}>
                        <RefiningComingSoonPage
                          onOpenCrafting={() => navigateModule("crafting")}
                        />
                      </Suspense>
                    </>
                  )}'''
          new_route = '''        {route === "refining" && (
                    <>
                      <ModuleHeader
                        eyebrow="Módulo de refinamiento"
                        title="Calculadora de refinamiento"
                        description="Selecciona un recurso T2–T8 y compara materiales, retorno, foco, tarifa de estación, beneficio, ROI y precio de equilibrio."
                      />
                      {repositoryError ? (
                        <RepositoryError message={repositoryError} />
                      ) : repository ? (
                        <Suspense fallback={<ModuleFallback label="refinamiento" />}>
                          <RefiningCalculatorPage repository={repository} />
                        </Suspense>
                      ) : (
                        <ModuleFallback label="refinamiento" />
                      )}
                    </>
                  )}'''
          if app.count(old_route) != 1:
              raise SystemExit(f'expected one legacy refining route, found {app.count(old_route)}')
          app_path.write_text(app.replace(old_route, new_route, 1))

          module_header = '''import type { ReactNode } from 'react'

          interface ModuleHeaderProps {
            readonly eyebrow: string
            readonly title: string
            readonly description: string
            readonly badge?: string
            readonly actions?: ReactNode
          }

          export function ModuleHeader({
            eyebrow,
            title,
            description,
            badge,
            actions,
          }: ModuleHeaderProps) {
            return (
              <section className="mx-auto w-full max-w-7xl px-5 pb-4 pt-6 sm:px-6 sm:pt-8">
                <div className="flex flex-col gap-5 border-b border-border pb-6 lg:flex-row lg:items-end lg:justify-between">
                  <div className="max-w-3xl">
                    <div className="flex flex-wrap items-center gap-2">
                      <p className="text-[10px] font-semibold uppercase tracking-[0.2em] text-accent">
                        {eyebrow}
                      </p>
                      {badge && (
                        <span className="rounded-full border border-accent-border bg-accent-muted px-2 py-0.5 text-[9px] font-semibold uppercase tracking-[0.12em] text-accent">
                          {badge}
                        </span>
                      )}
                    </div>

                    <h1 className="mt-2 text-balance font-display text-2xl tracking-tight text-text sm:text-3xl">
                      {title}
                    </h1>

                    <p className="mt-2 max-w-2xl text-sm leading-relaxed text-text-muted">
                      {description}
                    </p>
                  </div>

                  {actions && <div className="shrink-0">{actions}</div>}
                </div>
              </section>
            )
          }
          '''
          Path('src/app/ModuleHeader.tsx').write_text(module_header)
          Path('src/features/refining-calculator/components/RefiningComingSoonPage.tsx').unlink()
          PY
      - name: Commit integration cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/app/ModuleHeader.tsx src/features/refining-calculator/components
          git commit -m 'refactor(refining): integrate calculator directly in route'
          git push origin HEAD:feat/refining-calculator-mvp
