name: Temporary bundle trim

on:
  push:
    branches:
      - feat/player-economic-profile

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/player-economic-profile
      - name: Trim redundant copy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/player-profile/components/EconomicProfilePanel.tsx')
          content = path.read_text()
          replacements = {
              '''Define tus condiciones reales de fabricación. Estos datos son
                manuales, privados y no se deducen del personaje público
                vinculado.''': 'Datos manuales y privados, independientes del personaje público.',
              '''Introduce manualmente el nivel y el valor visible de Bonus to
                    Focus Cost Efficiency para cada rama.''': 'Añade el nivel y la eficiencia de foco visibles para cada rama.',
              '''Las recomendaciones son comparaciones de tus propios cálculos guardados,
              no promesas de rentabilidad ni datos inventados. Los precios pueden quedar
              obsoletos y deben revisarse antes de fabricar.''': 'Compara tus cálculos guardados y revisa los precios antes de fabricar.',
          }
          for original, replacement in replacements.items():
              if original not in content:
                  raise SystemExit(f'target copy not found: {original[:40]!r}')
              content = content.replace(original, replacement, 1)
          path.write_text(content)
          PY
      - name: Commit trim
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/player-profile/components/EconomicProfilePanel.tsx
          git commit -m "perf: trim redundant economic profile copy"
          git push origin HEAD:feat/player-economic-profile
