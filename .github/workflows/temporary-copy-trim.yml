name: Temporary copy trim

on:
  push:
    branches:
      - feat/player-economic-profile

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/player-economic-profile
      - name: Shorten redundant help text
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('src/features/player-profile/components/EconomicProfilePanel.tsx')
          content = path.read_text()
          replacements = [
              (
                  r'Define tus condiciones reales de fabricación\. Estos datos son\s+manuales, privados y no se deducen del personaje público\s+vinculado\.',
                  'Datos manuales y privados, independientes del personaje público.',
              ),
              (
                  r'Introduce manualmente el nivel y el valor visible de Bonus to\s+Focus Cost Efficiency para cada rama\.',
                  'Añade el nivel y la eficiencia de foco visibles para cada rama.',
              ),
              (
                  r'Las recomendaciones son comparaciones de tus propios cálculos guardados,\s+no promesas de rentabilidad ni datos inventados\. Los precios pueden quedar\s+obsoletos y deben revisarse antes de fabricar\.',
                  'Compara tus cálculos guardados y revisa los precios antes de fabricar.',
              ),
          ]
          for pattern, replacement in replacements:
              content, count = re.subn(pattern, replacement, content, count=1)
              if count != 1:
                  raise SystemExit(f'expected one replacement for {pattern!r}, got {count}')
          path.write_text(content)
          PY
      - name: Commit copy trim
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/player-profile/components/EconomicProfilePanel.tsx
          git commit -m "perf: trim economic profile help copy"
          git push origin HEAD:feat/player-economic-profile
