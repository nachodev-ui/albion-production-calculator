name: Fix data trust lint lifecycle

on:
  push:
    branches:
      - feat/data-trust-center

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/data-trust-center
          fetch-depth: 0
      - name: Defer initial load outside the effect body
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/features/data-trust/components/DataStatusPage.tsx')
          source = path.read_text(encoding='utf-8')
          old = """  useEffect(() => {
              void load()
            }, [load])
          """
          new = """  useEffect(() => {
              const frame = window.requestAnimationFrame(() => {
                void load()
              })

              return () => window.cancelAnimationFrame(frame)
            }, [load])
          """
          if old not in source:
              raise SystemExit('DataStatusPage effect block not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary diagnostics
        shell: bash
        run: |
          rm -f data-trust-lint-output.txt
          rm -f .github/workflows/diagnose-data-trust-lint.yml
          rm -f .github/workflows/fix-data-trust-lint.yml
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: defer data status initial refresh'
          git push origin HEAD:feat/data-trust-center
