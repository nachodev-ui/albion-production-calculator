name: Fix scanner import

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/black-market-opportunity-scanner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/black-market-opportunity-scanner
      - name: Remove unused React import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/black-market/components/BlackMarketOpportunityScannerPage.tsx')
          text = path.read_text()
          text = text.replace(
              'import { useEffect, useMemo, useRef, useState, type FormEvent } from "react";',
              'import { useEffect, useRef, useState, type FormEvent } from "react";',
          )
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/black-market/components/BlackMarketOpportunityScannerPage.tsx
          git commit -m "fix: remove unused scanner import"
          git push origin HEAD:feat/black-market-opportunity-scanner
