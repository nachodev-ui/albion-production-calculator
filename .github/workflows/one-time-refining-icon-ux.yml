name: One-time refining icon loading UX

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/refining-icon-loading-perception

      - name: Apply refining loading UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          script = Path('scripts/apply-refining-icon-loading-ux.py')
          exec(compile(script.read_text(encoding='utf-8'), str(script), 'exec'))
          PY
