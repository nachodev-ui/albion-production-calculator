name: Patch weapon name generator

on:
  push:
    branches: [fix/player-profile-weapon-presentation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/player-profile-weapon-presentation
          fetch-depth: 0

      - name: Extend dataset generator
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('scripts/generate-dataset.ts')
          content = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "const OUTPUT_PATH = './src/data/datasets/items.json'\nconst LOCALE = 'ES-ES'",
                  "const OUTPUT_PATH = './src/data/datasets/items.json'\nconst WEAPON_FAMILY_NAMES_OUTPUT_PATH =\n  './src/features/player-profile/data/weaponFamilyNames.es.json'\nconst LOCALE = 'ES-ES'",
              ),
              (
                  "// ---------------------------------------------------------------------------\n// Main\n// ---------------------------------------------------------------------------",
                  "const EQUIPPABLE_WEAPON_ID_PATTERN = /^T[2-8]_(.+)$/\nconst INITIATE_NAME_SUFFIX = /\\s+del iniciado$/i\n\nfunction buildWeaponFamilyNames(items: readonly OutputItem[]): Record<string, string> {\n  const candidates = new Map<string, { tier: number; name: string }>()\n\n  for (const item of items) {\n    if (item.category !== 'weapon' || item.id.includes('_ARTEFACT_')) continue\n\n    const family = EQUIPPABLE_WEAPON_ID_PATTERN.exec(item.id)?.[1]\n    if (!family) continue\n\n    const current = candidates.get(family)\n    if (\n      !current ||\n      item.tier === 4 ||\n      (current.tier !== 4 && item.tier < current.tier)\n    ) {\n      candidates.set(family, {\n        tier: item.tier,\n        name: item.name.replace(INITIATE_NAME_SUFFIX, ''),\n      })\n    }\n  }\n\n  return Object.fromEntries(\n    [...candidates.entries()]\n      .sort(([left], [right]) => left.localeCompare(right))\n      .map(([family, entry]) => [family, entry.name]),\n  )\n}\n\n// ---------------------------------------------------------------------------\n// Main\n// ---------------------------------------------------------------------------",
              ),
              (
                  "  mkdirSync(dirname(OUTPUT_PATH), { recursive: true })\n  writeFileSync(OUTPUT_PATH, JSON.stringify(items, null, 2), 'utf-8')\n  console.log(`Dataset escrito en ${OUTPUT_PATH}`)",
                  "  mkdirSync(dirname(OUTPUT_PATH), { recursive: true })\n  writeFileSync(OUTPUT_PATH, JSON.stringify(items, null, 2), 'utf-8')\n  console.log(`Dataset escrito en ${OUTPUT_PATH}`)\n\n  const weaponFamilyNames = buildWeaponFamilyNames(items)\n  mkdirSync(dirname(WEAPON_FAMILY_NAMES_OUTPUT_PATH), { recursive: true })\n  writeFileSync(\n    WEAPON_FAMILY_NAMES_OUTPUT_PATH,\n    JSON.stringify(weaponFamilyNames, null, 2),\n    'utf-8',\n  )\n  console.log(\n    `Mapa de ${Object.keys(weaponFamilyNames).length} familias de armas escrito en ${WEAPON_FAMILY_NAMES_OUTPUT_PATH}`,\n  )",
              ),
          ]

          for old, new in replacements:
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one replacement target, found {count}: {old[:80]!r}')
              content = content.replace(old, new)

          path.write_text(content, encoding='utf-8')
          Path('.github/workflows/patch-weapon-name-generator.yml').unlink()
          PY

      - name: Commit generator update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-dataset.ts .github/workflows/patch-weapon-name-generator.yml
          git commit -m "build: generate compact weapon localization map"
          git push origin HEAD:fix/player-profile-weapon-presentation
