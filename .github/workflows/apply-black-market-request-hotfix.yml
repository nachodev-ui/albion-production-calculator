name: Apply Black Market request hotfix

on:
  push:
    branches:
      - fix/black-market-opportunity-request-body
    paths:
      - .github/workflows/apply-black-market-request-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/black-market-opportunity-request-body
      - name: Sanitize opportunity scanner request body
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/black-market/api/blackMarketOpportunitiesApi.ts')
          text = path.read_text(encoding='utf-8')
          old = '      body: JSON.stringify(request),'
          new = '''      body: JSON.stringify({
        server: request.server,
        purchaseMarketKeys: request.purchaseMarketKeys,
        tiers: request.tiers,
        enchantments: request.enchantments,
        qualities: request.qualities,
        categories: request.categories,
        minimumProfit: request.minimumProfit,
        minimumReturnOnCostPercent: request.minimumReturnOnCostPercent,
        maximumCityAgeMinutes: request.maximumCityAgeMinutes,
        maximumBlackMarketAgeMinutes: request.maximumBlackMarketAgeMinutes,
        salesTaxRate: request.salesTaxRate,
        transportCostPerUnit: request.transportCostPerUnit,
        sort: request.sort,
        limit: request.limit,
        offset: request.offset,
      }),'''
          if old not in text:
              raise SystemExit('target serialization line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/features/black-market/api/blackMarketOpportunitiesApi.ts
          git commit -m "fix: sanitize Black Market opportunity request body"
          git push origin HEAD:fix/black-market-opportunity-request-body
