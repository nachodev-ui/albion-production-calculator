name: Format Black Market scanner

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/black-market-opportunity-scanner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/black-market-opportunity-scanner
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix lint and formatting
        run: |
          pnpm exec eslint . --fix
          pnpm exec prettier --write \
            src/App.tsx \
            src/features/black-market/types.ts \
            src/features/black-market/api/blackMarketOpportunitiesApi.ts \
            src/features/black-market/api/blackMarketOpportunitiesApi.test.ts \
            src/features/black-market/storage/blackMarketScannerStorage.ts \
            src/features/black-market/storage/blackMarketScannerStorage.test.ts \
            src/features/black-market/components/BlackMarketOpportunityScannerPage.tsx
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/features/black-market
          git commit -m "style: format Black Market opportunity scanner"
          git push origin HEAD:feat/black-market-opportunity-scanner
